      const { shape, corner } = handle;
      if (!isShapeSelected(shape)) {
        selectRangeShape(shape, { additive: evt.shiftKey });
      }
      state.resizing = {
        shapeId: shape.id,
        fixed: oppositeCorner(corner.key, shape),
        pointerId: evt.pointerId,
        changed: false
      };
      state.drawing = null;
      state.drawingAdditive = false;
      state.pendingSelection = null;
      state.drawingPointerId = evt.pointerId;
      canvas.setPointerCapture(evt.pointerId);
      canvas.style.cursor = corner.cursor;
      renderShapeList();
      renderRangeControls();
      draw();
    }

    function updateResize(point) {
      const active = state.resizing;
      if (!active) return;
      const shape = readFrameShapes().find(item => item.id === active.shapeId);
      if (!shape || !isRangeShape(shape)) return;
      const nextPoint = { x: point.x, y: point.y };
      const [a, b] = shape.points;
      if (a.x === active.fixed.x && a.y === active.fixed.y && b.x === nextPoint.x && b.y === nextPoint.y) return;
      if (!active.changed) {
        pushHistory('调整矩形');
        markCurrentFileEdited();
        active.changed = true;
      }
      shape.points = [{ ...active.fixed }, nextPoint];
      draw();
    }

    function finishResize(evt) {
      if (!state.resizing) return;
      const changed = state.resizing.changed;
      state.resizing = null;
      releaseDrawingPointer(evt);
      canvas.style.cursor = '';
      if (changed) {
        setDirty(true);
        renderShapeList();
        renderRangeControls();
      }
      draw();
    }

    canvas.addEventListener('pointerdown', evt => {
      if (!currentFile()) return;
      if (evt.button !== 0) return;
      const p = canvasPoint(evt);
      const handle = pickResizeHandleAt(p);
      if (handle) {
        beginResize(handle, evt);
        evt.preventDefault();
        return;
      }
      const hit = pickShapeAt(p);
      if (hit) {
        state.pendingSelection = { start: p, hitId: hit.id, additive: evt.shiftKey };
        state.drawingPointerId = evt.pointerId;
        canvas.setPointerCapture(evt.pointerId);
        evt.preventDefault();
        return;
      }
      startDrawingAt(p, evt.shiftKey, evt.pointerId);
      evt.preventDefault();
    });

    canvas.addEventListener('pointermove', evt => {
      const p = canvasPoint(evt);
      if (state.resizing) {
        updateResize(p);
        return;
      }
      if (state.pendingSelection) {
        if (dragStarted(state.pendingSelection.start, p)) {
          startDrawingAt(state.pendingSelection.start, state.pendingSelection.additive, evt.pointerId);
          state.drawing.points[1] = p;
          draw();
        }
        return;
      }
      if (!state.drawing) {
        const handle = pickResizeHandleAt(p);
        canvas.style.cursor = handle ? handle.corner.cursor : '';
        return;
      }
      state.drawing.points[1] = p;
      draw();
    });

    canvas.addEventListener('pointerup', evt => {
      if (state.resizing) {
        finishResize(evt);
        return;
      }
      if (state.pendingSelection) {
        const pending = state.pendingSelection;
        const hit = readFrameShapes().find(shape => shape.id === pending.hitId);
        state.pendingSelection = null;
        releaseDrawingPointer(evt);
        if (hit) {
          selectRangeShape(hit, { additive: pending.additive });
          renderShapeList();
          renderRangeControls();
          draw();
        }
        return;
      }
      finishDrawing(evt);
    });
    canvas.addEventListener('pointercancel', evt => {
      const resizeChanged = state.resizing?.changed;
      resetCanvasInteraction();
      releaseDrawingPointer(evt);
      if (resizeChanged) setDirty(true);
      draw();
    });

    document.getElementById('rectTool').addEventListener('click', () => setTool());
    resetShortcutsBtn.addEventListener('click', () => {
      state.shortcuts = { ...DEFAULT_SHORTCUTS };
      state.capturingShortcut = null;
      saveShortcuts();
      renderShortcutList();
      statusEl.textContent = '快捷键已重置';
    });
    document.getElementById('prevBtn').addEventListener('click', () => setFrame(state.frame - 1));
    document.getElementById('nextBtn').addEventListener('click', () => setFrame(state.frame + 1));
    document.getElementById('cancelBtn').addEventListener('click', () => {
      resetCanvasInteraction();
      releaseDrawingPointer();
      draw();
    });
    document.getElementById('undoBtn').addEventListener('click', undoLast);
    document.getElementById('completeBtn').addEventListener('click', toggleCurrentFileComplete);
    document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (!currentFile()) return;
      pushHistory('清空本帧');
      markCurrentFileEdited();
      fileStore().frames[String(state.frame)] = [];
      state.selectedId = null;
      state.selectedIds = [];
      state.rangeShapeIds = [];
      setDirty(true);
      renderShapeList();
      draw();
    });
    rangeTimeline.addEventListener('pointerdown', evt => {
      if (!currentFile() || isSingleFrame() || state.busy) return;
      if (evt.target === rangeStartHandle) state.activeRangeHandle = 'start';
      else if (evt.target === rangeEndHandle) state.activeRangeHandle = 'end';
      else {
        setNearestRangeHandle(evt);
        return;
      }
      evt.preventDefault();
      rangeTimeline.setPointerCapture(evt.pointerId);
      updateRangeHandle(state.activeRangeHandle, evt);
    });
    rangeTimeline.addEventListener('pointermove', evt => {
      if (!state.activeRangeHandle) return;
      updateRangeHandle(state.activeRangeHandle, evt);
    });
    rangeTimeline.addEventListener('pointerup', evt => {
      state.activeRangeHandle = null;
      if (rangeTimeline.hasPointerCapture(evt.pointerId)) {
        rangeTimeline.releasePointerCapture(evt.pointerId);
      }
    });
    rangeTimeline.addEventListener('pointercancel', evt => {
      state.activeRangeHandle = null;
      if (rangeTimeline.hasPointerCapture(evt.pointerId)) {
        rangeTimeline.releasePointerCapture(evt.pointerId);
      }
    });
    document.getElementById('setRangeSourceBtn').addEventListener('click', () => {
      state.rangeSource = clampFrameIndex(state.frame);
      state.rangeSourceLocked = true;
      captureRangeShapes(state.rangeSource);
      renderRangeControls();
      draw();
    });
    document.getElementById('setRangeStartBtn').addEventListener('click', () => {
      adoptCurrentFrameShapeIfNeeded();
      setRange(state.frame, state.rangeEnd);
    });
    document.getElementById('setRangeEndBtn').addEventListener('click', () => setRange(state.rangeStart, state.frame));
    document.getElementById('setWholeRangeBtn').addEventListener('click', () => {
      const file = currentFile();
      if (!file) return;
      setRange(0, file.frameCount - 1);
    });
    document.getElementById('applyRangeBtn').addEventListener('click', applyRangeToFrames);
    document.getElementById('saveBtn').addEventListener('click', async () => {
      try {
        await saveAnnotations();
      } catch (error) {
        showError(error);
      }
    });
    document.getElementById('saveDirBtn').addEventListener('click', () => saveDirectories().catch(showError));
    document.getElementById('refreshBtn').addEventListener('click', () => boot().catch(showError));
    selectAllSourcesBtn.addEventListener('click', () => {
      if (!state.workspace?.sourceFiles.length) {
        statusEl.textContent = '没有可选图片';
        return;
      }
      updateActiveFiles(new Set(state.workspace.sourceFiles.map(source => source.id))).catch(showError);
    });
    document.getElementById('extractSelectedBtn').addEventListener('click', () => {
      const sources = [...activeIdsFromWorkspace()]
        .map(id => state.workspace?.sourceFiles.find(item => item.id === id))
        .filter(Boolean);
      const pendingSources = sources.filter(source => !source.imported || source.stale);
      if (!pendingSources.length) {
        statusEl.textContent = '选中文件都已加载，源文件没有变化';
        return;
      }
      extractAssets(
        pendingSources.map(source => source.id),
        pendingSources.some(source => source.stale)
      ).catch(showError);
    });
    document.getElementById('exportSelectedBtn').addEventListener('click', () => {
      exportSelectedAssets().catch(showError);
    });
    frameSlider.addEventListener('input', () => setFrame(Number(frameSlider.value)));
    frameSlider.addEventListener('pointerdown', evt => {
      if (frameSlider.disabled || isSingleFrame()) return;
      evt.preventDefault();
      state.frameSliderDragging = true;
      frameSlider.setPointerCapture(evt.pointerId);
      setFrame(frameFromSliderEvent(evt));
    });
    frameSlider.addEventListener('pointermove', evt => {
      if (!state.frameSliderDragging) return;
      evt.preventDefault();
      setFrame(frameFromSliderEvent(evt));
    });
    frameSlider.addEventListener('pointerup', evt => {
      state.frameSliderDragging = false;
      if (frameSlider.hasPointerCapture(evt.pointerId)) {
        frameSlider.releasePointerCapture(evt.pointerId);
      }
    });
    frameSlider.addEventListener('pointercancel', evt => {
      state.frameSliderDragging = false;
      if (frameSlider.hasPointerCapture(evt.pointerId)) {
        frameSlider.releasePointerCapture(evt.pointerId);
      }
    });

    window.addEventListener('keydown', evt => {
      if (state.capturingShortcut) {
        const combo = shortcutForEvent(evt);
        if (!combo) return;
        evt.preventDefault();
        setShortcut(state.capturingShortcut, combo);
        return;
      }
      if (evt.target instanceof HTMLInputElement) return;
      if (shortcutMatches(evt, 'save')) {
        evt.preventDefault();
        document.getElementById('saveBtn').click();
        return;
      }
      if (shortcutMatches(evt, 'undo')) {
        evt.preventDefault();
        undoLast();
        return;
      }
      if (shortcutMatches(evt, 'prevFile')) {
        evt.preventDefault();
        selectRelativeFile(-1);
        return;
      }
      if (shortcutMatches(evt, 'nextFile')) {
        evt.preventDefault();
        selectRelativeFile(1);
        return;
      }
      if (shortcutMatches(evt, 'prevFrame')) {
        evt.preventDefault();
        setFrame(state.frame - 1);
        return;
      }
      if (shortcutMatches(evt, 'nextFrame')) {
        evt.preventDefault();
        setFrame(state.frame + 1);
        return;
      }
      if (shortcutMatches(evt, 'toggleComplete')) {
        evt.preventDefault();
        completeCurrentFileAndAdvance();
        return;
      }
      if (shortcutMatches(evt, 'rangeStart')) {
        evt.preventDefault();
        adoptCurrentFrameShapeIfNeeded();
        setRange(state.frame, state.rangeEnd);
        return;
      }
      if (shortcutMatches(evt, 'rangeEnd')) {
        evt.preventDefault();
        setRange(state.rangeStart, state.frame);
        return;
      }
      if (shortcutMatches(evt, 'applyRange')) {
        evt.preventDefault();
        applyRangeToFrames();
        return;
      }
      if (shortcutMatches(evt, 'cancel')) {
        evt.preventDefault();
        resetCanvasInteraction();
        releaseDrawingPointer();
        draw();
        return;
      }
      if (shortcutMatches(evt, 'delete')) {
        evt.preventDefault();
        deleteSelected();
      }
    });

    window.addEventListener('pagehide', flushAutoSaveOnExit);
    window.addEventListener('beforeunload', flushAutoSaveOnExit);

    async function boot() {
      const [workspace, manifest, annotations] = await Promise.all([
        apiJson('/api/workspace'),
        apiJson('/api/manifest'),
        apiJson('/api/annotations')
      ]);
      state.annotations = annotations;
      state.savedSnapshot = annotationsSnapshot();
      state.history = [];
      state.saveError = false;
      state.saving = false;
      clearPendingAutoSave();
      applyWorkspaceAndManifest(workspace, manifest);
      setDirty(false);
    }

    loadShortcuts();
    renderShortcutList();
    boot().catch(showError);
  </script>
</body>
</html>
