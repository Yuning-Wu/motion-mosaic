      const file = currentFile();
      const trackIds = shapes.filter(isRangeShape).map(ensureShapeTrack);
      if (!file || !trackIds.length) return [state.frame, state.frame];
      const wanted = new Set(trackIds);
      let first = null;
      let last = null;
      const frames = state.annotations.files?.[file.id]?.frames || {};
      for (const [frameKey, frameShapes] of Object.entries(frames)) {
        if (!Array.isArray(frameShapes)) continue;
        const hasTrack = frameShapes.some(item => isRangeShape(item) && wanted.has(shapeTrackId(item)));
        if (!hasTrack) continue;
        const frame = clampFrameIndex(Number(frameKey));
        first = first === null ? frame : Math.min(first, frame);
        last = last === null ? frame : Math.max(last, frame);
      }
      return [first ?? state.frame, last ?? state.frame];
    }

    function selectRangeShapes(shapes, options = {}) {
      const nextShapes = shapes.filter(Boolean);
      state.selectedIds = [...new Set(nextShapes.map(shape => shape.id))];
      state.selectedId = options.primaryId && state.selectedIds.includes(options.primaryId)
        ? options.primaryId
        : (state.selectedIds[state.selectedIds.length - 1] || null);
      if (Object.prototype.hasOwnProperty.call(options, 'anchorId')) {
        state.selectionAnchorId = options.anchorId || null;
      } else if (!state.selectionAnchorId) {
        state.selectionAnchorId = state.selectedId;
      }
      if (state.selectionAnchorId && !state.selectedIds.includes(state.selectionAnchorId)) {
        state.selectionAnchorId = state.selectedId;
      }
      const rangeShapes = nextShapes.filter(isRangeShape);
      if (rangeShapes.length) {
        state.rangeSource = clampFrameIndex(state.frame);
        state.rangeSourceLocked = true;
        state.rangeShapeIds = rangeShapes.map(ensureShapeTrack);
        const [start, end] = rangeForShapes(rangeShapes);
        state.rangeStart = start;
        state.rangeEnd = end;
      } else {
        state.rangeShapeIds = [];
      }
    }

    function frameShapeRange(anchorId, targetId) {
      const shapes = readFrameShapes();
      const targetIndex = shapes.findIndex(shape => shape.id === targetId);
      if (targetIndex < 0) return [];
      const anchorIndex = shapes.findIndex(shape => shape.id === anchorId);
      if (anchorIndex < 0) return [shapes[targetIndex]];
      const start = Math.min(anchorIndex, targetIndex);
      const end = Math.max(anchorIndex, targetIndex);
      return shapes.slice(start, end + 1);
    }

    function selectRangeShape(shape, options = {}) {
      if (!shape) {
        clearSelection();
        return;
      }
      if (options.range) {
        const anchorId = state.selectionAnchorId || state.selectedId || shape.id;
        const rangeShapes = frameShapeRange(anchorId, shape.id);
        if (options.additive) {
          const selected = new Map(selectedFrameShapes().map(item => [item.id, item]));
          for (const item of rangeShapes) selected.set(item.id, item);
          selectRangeShapes([...selected.values()], { anchorId, primaryId: shape.id });
        } else {
          selectRangeShapes(rangeShapes, { anchorId, primaryId: shape.id });
        }
        return;
      }
      if (!options.additive) {
        selectRangeShapes([shape], { anchorId: shape.id, primaryId: shape.id });
        return;
      }

      const current = selectedFrameShapes();
      const alreadySelected = current.some(item => item.id === shape.id);
      const nextShapes = alreadySelected
        ? current.filter(item => item.id !== shape.id)
        : [...current, shape];
      const nextAnchor = state.selectionAnchorId && nextShapes.some(item => item.id === state.selectionAnchorId)
        ? state.selectionAnchorId
        : (nextShapes[nextShapes.length - 1]?.id || null);
      selectRangeShapes(nextShapes, {
        anchorId: nextAnchor,
        primaryId: alreadySelected ? nextAnchor : shape.id
      });
    }

    function rangeSourceShapes() {
      const file = currentFile();
      if (!file) return [];
      const sourceFrame = clampFrameIndex(state.rangeSource);
      const shapes = readFrameShapes(file.id, sourceFrame).filter(isRangeShape);
      if (!state.rangeShapeIds.length) return shapes;
      const wanted = new Set(state.rangeShapeIds);
      return shapes.filter(shape => shapeMatchesRangeSelection(shape, wanted));
    }

    function cloneShapeForRange(shape) {
      const trackId = ensureShapeTrack(shape);
      return {
        ...shape,
        id: uid(),
        trackId,
        points: shape.points.map(point => ({ ...point }))
      };
    }

    function rangePreviewShapes() {
      const file = currentFile();
      if (!file || isSingleFrame(file)) return [];
      if (!targetFrameSet().has(state.frame)) return [];
      const sourceShapes = rangeSourceShapes();
      if (!sourceShapes.length) return [];
      const currentTracks = new Set(readFrameShapes(file.id, state.frame).filter(isRangeShape).map(shapeTrackId));
      return sourceShapes.filter(shape => !currentTracks.has(shapeTrackId(shape)));
    }

    function adoptCurrentFrameShapeIfNeeded() {
      const file = currentFile();
      if (!file || rangeSourceShapes().length) return;
      const shapes = readFrameShapes(file.id, state.frame).filter(isRangeShape);
      if (!shapes.length) return;
      state.rangeSource = clampFrameIndex(state.frame);
      state.rangeSourceLocked = true;
      state.rangeShapeIds = [ensureShapeTrack(shapes[shapes.length - 1])];
      state.selectedIds = [shapes[shapes.length - 1].id];
      state.selectionAnchorId = shapes[shapes.length - 1].id;
      syncPrimarySelection();
    }

    function pointInRectShape(point, shape) {
      if (shape?.type !== 'rect' || !isRangeShape(shape)) return false;
      const [a, b] = shape.points;
      const left = Math.min(a.x, b.x);
      const right = Math.max(a.x, b.x);
      const top = Math.min(a.y, b.y);
      const bottom = Math.max(a.y, b.y);
      return point.x >= left && point.x <= right && point.y >= top && point.y <= bottom;
    }

    function pointInPolygonShape(point, shape) {
      if (shape?.type !== 'polygon' || !isRangeShape(shape)) return false;
      let inside = false;
      const points = shape.points;
      for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
        const a = points[i];
        const b = points[j];
        const intersects = ((a.y > point.y) !== (b.y > point.y)) &&
          (point.x < (b.x - a.x) * (point.y - a.y) / ((b.y - a.y) || 1) + a.x);
        if (intersects) inside = !inside;
      }
      return inside;
    }

    function distanceToSegment(point, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      if (dx === 0 && dy === 0) return Math.hypot(point.x - a.x, point.y - a.y);
      const ratio = Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / (dx * dx + dy * dy)));
      const x = a.x + ratio * dx;
      const y = a.y + ratio * dy;
      return Math.hypot(point.x - x, point.y - y);
    }

    function pointNearPolygonEdge(point, shape, tolerance = handleHitRadius()) {
      if (shape?.type !== 'polygon' || !isRangeShape(shape)) return false;
      const points = shape.points;
      for (let index = 0; index < points.length; index += 1) {
        const next = points[(index + 1) % points.length];
        if (distanceToSegment(point, points[index], next) <= tolerance) return true;
      }
      return false;
    }

    function pointInShape(point, shape) {
      if (shape?.type === 'rect') return pointInRectShape(point, shape);
      if (shape?.type === 'polygon') return pointInPolygonShape(point, shape) || pointNearPolygonEdge(point, shape);
      return false;
    }

    function pickShapeAt(point) {
      return [...readFrameShapes()].reverse().find(shape => pointInShape(point, shape)) || null;
    }

    function rectBounds(shape) {
      const [a, b] = shape.points;
      return {
        left: Math.min(a.x, b.x),
        right: Math.max(a.x, b.x),
        top: Math.min(a.y, b.y),
        bottom: Math.max(a.y, b.y)
      };
    }

    function rectCorners(shape) {
      const { left, right, top, bottom } = rectBounds(shape);
      return [
        { kind: 'rect-corner', key: 'nw', x: left, y: top, cursor: 'nwse-resize' },
        { kind: 'rect-corner', key: 'ne', x: right, y: top, cursor: 'nesw-resize' },
        { kind: 'rect-corner', key: 'se', x: right, y: bottom, cursor: 'nwse-resize' },
        { kind: 'rect-corner', key: 'sw', x: left, y: bottom, cursor: 'nesw-resize' }
      ];
    }

    function polygonHandles(shape) {
      return (shape.points || []).map((point, index) => ({
        kind: 'polygon-point',
        key: `p${index}`,
        pointIndex: index,
        x: point.x,
        y: point.y,
        cursor: 'move'
      }));
    }

    function shapeHandles(shape) {
      if (shape.type === 'rect') return rectCorners(shape);
      if (shape.type === 'polygon') return polygonHandles(shape);
      return [];
    }

    function oppositeCorner(corner, shape) {
      const { left, right, top, bottom } = rectBounds(shape);
      if (corner === 'nw') return { x: right, y: bottom };
      if (corner === 'ne') return { x: left, y: bottom };
      if (corner === 'se') return { x: left, y: top };
      return { x: right, y: top };
    }

    function handleRadius() {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return 6;
      const scale = Math.max(canvas.width / rect.width, canvas.height / rect.height);
      return Math.max(5, Math.min(16, Math.round(scale * 5)));
    }

    function handleHitRadius() {
      return handleRadius() + 6;
    }

    function pickResizeHandleAt(point) {
      const selected = new Set(selectedIds());
      if (!selected.size) return null;
      const hitRadius = handleHitRadius();
      const shapes = [...readFrameShapes()].reverse().filter(shape => selected.has(shape.id) && isRangeShape(shape));
      for (const shape of shapes) {
        for (const handle of shapeHandles(shape)) {
          if (Math.hypot(point.x - handle.x, point.y - handle.y) <= hitRadius) {
            return { shape, handle };
          }
        }
      }
      return null;
    }

    function pickPolygonEdgeAt(point) {
      const selected = new Set(selectedIds());
      if (!selected.size) return null;
      const tolerance = handleHitRadius();
      const shapes = [...readFrameShapes()].reverse()
        .filter(shape => selected.has(shape.id) && shape.type === 'polygon' && isRangeShape(shape));
      for (const shape of shapes) {
        for (let index = 0; index < shape.points.length; index += 1) {
          const nextIndex = (index + 1) % shape.points.length;
          const distance = distanceToSegment(point, shape.points[index], shape.points[nextIndex]);
          if (distance <= tolerance) {
            return { shape, edgeIndex: index, distance };
          }
        }
      }
      return null;
    }

    function insertPolygonPoint(edge, point) {
      const shape = readFrameShapes().find(item => item.id === edge?.shape?.id);
      if (!shape || shape.type !== 'polygon') return false;
      pushHistory('添加多边形顶点');
      markCurrentFileEdited();
      shape.points.splice(edge.edgeIndex + 1, 0, { x: point.x, y: point.y });
      selectRangeShape(shape);
      setDirty(true);
      renderShapeList();
      renderRangeControls();
      draw();
      statusEl.textContent = '已添加多边形顶点';
      return true;
    }

    function rectLargeEnough(a, b) {
      return Math.abs(a.x - b.x) >= RECT_MIN_SIZE && Math.abs(a.y - b.y) >= RECT_MIN_SIZE;
    }

    function polygonArea(points) {
      if (!Array.isArray(points) || points.length < 3) return 0;
      let area = 0;
      for (let index = 0; index < points.length; index += 1) {
        const next = points[(index + 1) % points.length];
        const current = points[index];
        area += current.x * next.y - next.x * current.y;
      }
      return Math.abs(area) / 2;
    }

    function polygonLargeEnough(points) {
      if (!Array.isArray(points) || points.length < 3) return false;
      return polygonArea(points) >= RECT_MIN_SIZE * RECT_MIN_SIZE;
    }

    function polygonCloseHit(point) {
      if (!state.drawing || state.drawing.type !== 'polygon' || state.drawing.points.length < 3) return false;
      const first = state.drawing.points[0];
      return Math.hypot(point.x - first.x, point.y - first.y) <= handleHitRadius();
    }

    function removeLastPolygonPoint() {
      if (!state.drawing || state.drawing.type !== 'polygon') return false;
      if (state.drawing.points.length <= 1) {
        resetCanvasInteraction();
        draw();
        statusEl.textContent = '已取消多边形';
        return true;
      }
      state.drawing.points.pop();
      draw();
      statusEl.textContent = `多边形：${state.drawing.points.length} 点`;
      return true;
    }

    function dragStarted(a, b) {
      return Math.abs(a.x - b.x) >= RECT_MIN_SIZE || Math.abs(a.y - b.y) >= RECT_MIN_SIZE;
    }

    function resetCanvasInteraction() {
      state.drawing = null;
      state.pendingSelection = null;
      state.resizing = null;
      canvas.style.cursor = '';
    }

    function setDirty(value, options = {}) {
      state.dirty = value;
      if (value) state.saveError = false;
      else clearPendingAutoSave();
      updateSaveIndicator();
      renderActionControls();
      if (value && options.autoSave !== false) scheduleAutoSave();
    }

    function setBusy(value, message = '') {
      state.busy = value;
      if (value) stopPlayback();
      if (message) statusEl.textContent = message;
      document.querySelectorAll('button').forEach(button => {
        if (button.id !== 'saveBtn') button.disabled = value;
      });
      if (value) {
        frameSlider.disabled = true;
        playBtn.disabled = true;
        prevBtn.disabled = true;
        nextBtn.disabled = true;
      } else {
        syncFrameControls();
        renderRangeControls();
        renderActionControls();
        if (state.workspace) renderSourceFileList();
      }
    }

    async function apiJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });
      const raw = await response.text();
      let data = {};
      if (raw) {
        try {
          data = JSON.parse(raw);
        } catch {
          data = { ok: false, error: raw.slice(0, 160) };
        }
      }
      if (!response.ok || data.ok === false) {
        const error = new Error(data.error || `${response.status} ${response.statusText}`);
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function setTool(tool = 'rect') {
      resetCanvasInteraction();
      state.activeTool = tool === 'polygon' ? 'polygon' : 'rect';
      toolModeLabel.textContent = state.activeTool === 'polygon' ? '多边形' : '矩形';
      toolModeBtn.dataset.tool = state.activeTool;
      toolModeBtn.classList.add('active');
      toolModeBtn.setAttribute('aria-expanded', 'false');
      toolMenu.hidden = true;
      statusEl.textContent = state.activeTool === 'polygon'
        ? '多边形：点击加点，点击首点/双击/Enter 完成'
        : '矩形：拖拽创建区域';
      draw();
    }

    function canvasPoint(evt) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.round((evt.clientX - rect.left) * canvas.width / rect.width);
      const y = Math.round((evt.clientY - rect.top) * canvas.height / rect.height);
      return {
        x: Math.max(0, Math.min(canvas.width, x)),
        y: Math.max(0, Math.min(canvas.height, y))
      };
    }

    function clampFrameIndex(frame) {
      const file = currentFile();
      if (!file) return 0;
      return Math.max(0, Math.min(file.frameCount - 1, Math.round(frame)));
    }

    function frameFromSliderEvent(evt) {
      const file = currentFile();
      if (!file || isSingleFrame(file)) return 0;
      const rect = frameSlider.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (evt.clientX - rect.left) / Math.max(1, rect.width)));
      return clampFrameIndex(ratio * (file.frameCount - 1));
    }

    function normalizedRange() {
      return [
        Math.min(state.rangeStart, state.rangeEnd),
        Math.max(state.rangeStart, state.rangeEnd)
      ];
    }

    function currentRangeSegments() {
      const file = currentFile();
      if (!file) return [];
      const start = clampFrameIndex(state.rangeStart);
      const end = clampFrameIndex(state.rangeEnd);
      if (start <= end) return [{ start, end }];
      return [
        { start, end: file.frameCount - 1 },
        { start: 0, end }
      ];
    }

    function currentRangeSegment() {
      return currentRangeSegments()[0] || { start: 0, end: 0 };
    }

    function mergeRangeSegments(segments) {
      const file = currentFile();
      if (!file) return [];
      const normalized = segments
        .map(segment => ({
          start: clampFrameIndex(Math.min(segment.start, segment.end)),
          end: clampFrameIndex(Math.max(segment.start, segment.end))
        }))
        .sort((a, b) => a.start - b.start || a.end - b.end);
      const merged = [];
      for (const segment of normalized) {
        const last = merged[merged.length - 1];
        if (last && segment.start <= last.end + 1) {
          last.end = Math.max(last.end, segment.end);
        } else {
          merged.push({ ...segment });
        }
      }
      return merged;
    }

    function targetRangeSegments() {
      return state.rangeSegments.length
        ? state.rangeSegments
        : currentRangeSegments();
    }

    function targetFrameIndexes() {
      const frames = new Set();
      for (const segment of targetRangeSegments()) {
        for (let frame = segment.start; frame <= segment.end; frame += 1) {
          frames.add(clampFrameIndex(frame));
        }
      }
      return [...frames].sort((a, b) => a - b);
    }

    function targetFrameSet() {
      return new Set(targetFrameIndexes());
    }

    function formatRangeSegments(segments = targetRangeSegments()) {
      return segments
        .map(segment => segment.start === segment.end
          ? `${segment.start + 1}`
          : `${segment.start + 1}-${segment.end + 1}`)
        .join('、');
    }

    function setRange(start, end) {
      state.rangeStart = clampFrameIndex(start);
      state.rangeEnd = clampFrameIndex(end);
      renderRangeControls();
      draw();
    }

    function addCurrentRangeSegment() {
      state.rangeSegments = mergeRangeSegments([...state.rangeSegments, ...currentRangeSegments()]);
      renderRangeControls();
      draw();
    }

    function clearRangeSegments() {
      state.rangeSegments = [];
      renderRangeControls();
      draw();
    }

    function setWholeRangeTarget() {
      const file = currentFile();
      if (!file) return;
      state.rangeStart = 0;
      state.rangeEnd = file.frameCount - 1;
      state.rangeSegments = [{ start: 0, end: file.frameCount - 1 }];
      renderRangeControls();
      draw();
    }

    function toggleTargetFrame(frame) {
      const target = clampFrameIndex(frame);
      const frames = targetFrameSet();
      if (frames.has(target)) frames.delete(target);
      else frames.add(target);
      state.rangeSegments = mergeRangeSegments([...frames].map(item => ({ start: item, end: item })));
      renderRangeControls();
      draw();
    }

    function percentForFrame(frame) {
      const file = currentFile();
      if (!file || file.frameCount <= 1) return 0;
      return clampFrameIndex(frame) / (file.frameCount - 1) * 100;
    }

    function frameFromTimelineEvent(evt) {
      const track = rangeTimeline.querySelector('.range-track');
      const rect = track.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (evt.clientX - rect.left) / Math.max(1, rect.width)));
      const file = currentFile();
      return clampFrameIndex(ratio * ((file?.frameCount || 1) - 1));
    }

    function updateRangeHandle(handle, evt) {
      const frame = frameFromTimelineEvent(evt);
      if (handle === 'start') setRange(frame, state.rangeEnd);
      if (handle === 'end') setRange(state.rangeStart, frame);
    }

    function renderRangeFrameStrip() {
      const file = currentFile();
      const signature = rangeFrameStripSignature(file);
      if (signature === state.rangeFrameStripSignature) return;
      state.rangeFrameStripSignature = signature;
      if (!file) {
        rangeFrameStrip.replaceChildren();
        rangeFrameStrip.style.gridTemplateColumns = '';
        return;
      }

      const [start, end] = normalizedRange();
      const targets = targetFrameSet();
      const sourceTracks = new Set(rangeSourceShapes().map(shapeTrackId));
      rangeFrameStrip.style.gridTemplateColumns = `repeat(${file.frameCount}, minmax(2px, 1fr))`;
      const fragment = document.createDocumentFragment();
      for (let frame = 0; frame < file.frameCount; frame++) {
        const button = document.createElement('button');
        const classes = ['range-frame'];
        const frameShapes = readFrameShapes(file.id, frame);
        const frameTracks = new Set(frameShapes.filter(isRangeShape).map(shapeTrackId));
        const willApply = targets.has(frame) && [...sourceTracks].some(trackId => !frameTracks.has(trackId));
        if (targets.has(frame)) classes.push('in-range');
        if (state.rangeSegments.length && frame >= start && frame <= end && !targets.has(frame)) classes.push('draft-range');
        if (willApply) classes.push('will-apply');
        if (frame === state.rangeSource) classes.push('source');
        if (frame === state.frame) classes.push('current');
        if (frameShapes.length) classes.push('has-shapes');
        button.className = classes.join(' ');
        button.type = 'button';
        button.disabled = isSingleFrame(file) || state.busy;
        button.title = targets.has(frame)
          ? `第 ${frame + 1} 帧 · 目标帧`
          : `第 ${frame + 1} 帧`;
        button.addEventListener('click', evt => {
          if (evt.ctrlKey || evt.metaKey) {
            toggleTargetFrame(frame);
          } else {
            setFrame(frame);
          }
        });
        fragment.appendChild(button);
      }
      rangeFrameStrip.replaceChildren(fragment);
    }

    function rangeFrameStripSignature(file) {
      if (!file) return 'empty';
      const frames = state.annotations.files?.[file.id]?.frames || {};
      const shapeMarks = Object.entries(frames)
        .filter(([, shapes]) => Array.isArray(shapes) && shapes.length)
        .map(([frame, shapes]) => {
          const tracks = shapes
            .filter(isRangeShape)
            .map(shapeTrackId)
            .sort()
            .join(',');
          return `${frame}:${shapes.length}:${tracks}`;
        })
        .sort()
        .join('|');
      return JSON.stringify([
        file.id,
        file.frameCount,
        Boolean(state.busy),
        state.frame,
        state.rangeSource,
        state.rangeStart,
        state.rangeEnd,
        state.rangeSegments,
        state.rangeShapeIds,
        shapeMarks
      ]);
    }

    function renderRangeControls() {
      const file = currentFile();
      const singleFrame = isSingleFrame(file);
      const disabled = !file || state.busy || singleFrame;
      [
        rangeStartHandle,
        rangeEndHandle,
        document.getElementById('setRangeSourceBtn'),
        document.getElementById('setRangeStartBtn'),
        document.getElementById('setRangeEndBtn'),
        document.getElementById('setWholeRangeBtn'),
        addRangeSegmentBtn,
        clearRangeSegmentsBtn,
        applyRangeBtn,
        removeRangeBtn
      ].forEach(element => {
        element.disabled = disabled;
      });
      copyShapesBtn.disabled = !file || state.busy || !selectedFrameShapes().length;
      pasteShapesBtn.disabled = !file || state.busy || !state.shapeClipboard.length;

      if (!file) {
        rangeTimeline.querySelectorAll('.range-target-segment').forEach(element => element.remove());
        rangeSelection.classList.remove('draft');
        rangeSelection.style.left = '0%';
        rangeSelection.style.width = '0%';
        rangeProgress.style.width = '0%';
        rangeSource.style.left = '0%';
        rangeCurrent.style.left = '0%';
        rangeStartHandle.style.left = '0%';
        rangeEndHandle.style.left = '0%';
        rangeSourceText.textContent = '无';
        rangeSpanText.textContent = '-';
        rangeCountText.textContent = '0 帧';
        rangeHint.textContent = '没有文件';
        renderRangeFrameStrip();
        return;
      }

      state.rangeSource = clampFrameIndex(state.rangeSource);
      state.rangeStart = clampFrameIndex(state.rangeStart);
      state.rangeEnd = clampFrameIndex(state.rangeEnd);
      state.rangeSegments = mergeRangeSegments(state.rangeSegments);
      const targetSegments = targetRangeSegments();
      const targetCount = targetFrameIndexes().length;
      const track = rangeTimeline.querySelector('.range-track');
      track.querySelectorAll('.range-target-segment').forEach(element => element.remove());
      const [primarySegment, ...extraSegments] = targetSegments;
      extraSegments.forEach(segment => {
        const marker = document.createElement('div');
        marker.className = 'range-target-segment';
        marker.style.left = `${percentForFrame(segment.start)}%`;
        marker.style.width = `${Math.max(0, percentForFrame(segment.end) - percentForFrame(segment.start))}%`;
        track.insertBefore(marker, rangeSelection);
      });
      rangeSelection.classList.remove('draft');
      rangeSelection.style.left = `${percentForFrame(primarySegment?.start || 0)}%`;
      rangeSelection.style.width = `${Math.max(0, percentForFrame(primarySegment?.end || 0) - percentForFrame(primarySegment?.start || 0))}%`;
      rangeProgress.style.width = `${percentForFrame(state.frame)}%`;
      rangeSource.style.left = `${percentForFrame(state.rangeSource)}%`;
      rangeCurrent.style.left = `${percentForFrame(state.frame)}%`;
      rangeStartHandle.style.left = `${percentForFrame(state.rangeStart)}%`;
      rangeEndHandle.style.left = `${percentForFrame(state.rangeEnd)}%`;
      const sourceCount = rangeSourceShapes().length;
      rangeSourceText.textContent = `源 ${state.rangeSource + 1} · ${sourceCount} 区域`;
      rangeSpanText.textContent = `目标 ${formatRangeSegments(targetSegments)}`;
      rangeCountText.textContent = `${targetCount} 帧`;
      applyRangeBtn.disabled = disabled || !sourceCount || !targetCount;
      removeRangeBtn.disabled = disabled || !sourceCount || !targetCount;
      clearRangeSegmentsBtn.disabled = disabled || !state.rangeSegments.length;
      if (!sourceCount && countFileShapes(file.id)) {
        rangeHint.textContent = '选择区域';
      } else if (!sourceCount) {
        rangeHint.textContent = '未选区域';
      } else if (state.rangeSegments.length > 1 || targetSegments.length > 1) {
        rangeHint.textContent = `${targetSegments.length} 段目标帧`;
      } else if (state.rangeSegments.length) {
        rangeHint.textContent = '目标已锁定';
      } else if (rangePreviewShapes().length) {
        rangeHint.textContent = '预览中';
      } else if (state.frame !== state.rangeSource) {
        rangeHint.textContent = `源 ${state.rangeSource + 1}`;
      } else {
        rangeHint.textContent = '就绪';
      }
      if (singleFrame) {
        rangeSourceText.textContent = '静态图';
        rangeSpanText.textContent = '无需范围';
        rangeCountText.textContent = '-';
        rangeHint.textContent = '静态图';
        copyShapesBtn.disabled = !file || state.busy || !selectedFrameShapes().length;
        pasteShapesBtn.disabled = !file || state.busy || !state.shapeClipboard.length;
      }
      renderRangeFrameStrip();
    }

    function applyRangeToFrames() {
      const file = currentFile();
      if (!file) return;
      const sourceFrame = clampFrameIndex(state.rangeSource);
      const source = rangeSourceShapes();
      if (!source.length) {
        statusEl.textContent = '源帧没有可应用的区域';
        return;
      }

      const targets = targetFrameIndexes();
      if (!targets.length) {
        statusEl.textContent = '没有目标帧';
        return;
      }

      pushHistory('应用区域到目标帧');
      markCurrentFileEdited();
      const store = fileStore(file.id);
      const sourceTracks = source.map(ensureShapeTrack);
      const sourceTrackSet = new Set(sourceTracks);
      for (const frame of targets) {
        const key = String(frame);
        const shapes = Array.isArray(store.frames[key]) ? store.frames[key] : [];
        const withoutSameTracks = shapes.filter(shape => !sourceTrackSet.has(shapeTrackId(shape)));
        store.frames[key] = [...withoutSameTracks, ...source.map(cloneShapeForRange)];
      }
      state.rangeShapeIds = sourceTracks;
      const currentShapes = readFrameShapes(file.id, state.frame)
        .filter(shape => sourceTrackSet.has(shapeTrackId(shape)));
      state.selectedIds = currentShapes.map(shape => shape.id);
      state.selectionAnchorId = state.selectedIds[0] || null;
      syncPrimarySelection();
      setDirty(true);
      renderShapeList();
      renderRangeControls();
      draw();
      statusEl.textContent = `已把第 ${sourceFrame + 1} 帧的 ${source.length} 个区域应用到 ${formatRangeSegments()}`;
    }

    function removeRangeShapesFromFrames() {
      const file = currentFile();
      if (!file) return;
      const source = rangeSourceShapes();
      if (!source.length) {
        statusEl.textContent = '没有可删除的当前区域';
        return;
      }
      const targets = targetFrameIndexes();
      if (!targets.length) {
        statusEl.textContent = '没有目标帧';
        return;
      }

      const sourceTracks = source.map(ensureShapeTrack);
      const sourceTrackSet = new Set(sourceTracks);
      const store = fileStore(file.id);
      const removableCount = targets.reduce((total, frame) => {
        const shapes = Array.isArray(store.frames[String(frame)]) ? store.frames[String(frame)] : [];
        return total + shapes.filter(shape => sourceTrackSet.has(shapeTrackId(shape))).length;
      }, 0);
      if (!removableCount) {
        statusEl.textContent = '目标帧没有这些区域';
        return;
      }

      pushHistory('从目标帧删除区域');
      markCurrentFileEdited();
      let removed = 0;
      for (const frame of targets) {
        const key = String(frame);
        const shapes = Array.isArray(store.frames[key]) ? store.frames[key] : [];
        const next = shapes.filter(shape => !sourceTrackSet.has(shapeTrackId(shape)));
        removed += shapes.length - next.length;
        store.frames[key] = next;
      }
      state.rangeShapeIds = state.rangeShapeIds.filter(trackId => !sourceTrackSet.has(trackId));
      const currentShapes = readFrameShapes(file.id, state.frame)
        .filter(shape => sourceTrackSet.has(shapeTrackId(shape)));
      state.selectedIds = currentShapes.map(shape => shape.id);
      state.selectionAnchorId = state.selectedIds[0] || null;
      syncPrimarySelection();
      setDirty(true);
      renderShapeList();
      renderRangeControls();
      draw();
      statusEl.textContent = `已从 ${formatRangeSegments()} 删除 ${removed} 个区域`;
    }

    function setFrame(frame, options = {}) {
      const file = currentFile();
      if (!file) return;
      if (!options.fromPlayback && state.playing) stopPlayback();
      state.frame = Math.max(0, Math.min(file.frameCount - 1, frame));
      resetCanvasInteraction();
      frameSlider.value = state.frame;
      frameText.textContent = `${state.frame + 1} / ${file.frameCount}`;
      frameKindText.textContent = fileKindText(file);
      if (!state.rangeSourceLocked) {
        state.rangeSource = state.frame;
      }
      const selectedTracks = new Set(state.rangeShapeIds);
      const matchingShapes = selectedTracks.size
        ? readFrameShapes(file.id, state.frame).filter(shape => shapeMatchesRangeSelection(shape, selectedTracks))
        : [];
      state.selectedIds = matchingShapes.map(shape => shape.id);
      state.selectionAnchorId = state.selectedIds[0] || null;
      syncPrimarySelection();
      renderRangeControls();
      loadFrameImage();
    }

    function selectFile(index, options = {}) {
      stopPlayback();
      if (!state.files.length) {
        clearCanvas('没有帧');
        return;
      }
      state.activeFile = Math.max(0, Math.min(state.files.length - 1, index));
      state.scrollSourceIntoView = Boolean(options.scrollSource);
      state.frame = 0;
      state.selectedId = null;
      state.selectedIds = [];
      state.selectionAnchorId = null;
      resetCanvasInteraction();
      const file = currentFile();
      const singleFrame = isSingleFrame(file);
      frameSlider.disabled = singleFrame;
      frameSlider.max = file.frameCount - 1;
      frameSlider.value = 0;
      playBtn.disabled = singleFrame;
      prevBtn.disabled = singleFrame;
      nextBtn.disabled = singleFrame;
      topbar.classList.toggle('static', singleFrame);
      frameKindText.textContent = fileKindText(file);
      expandSourceDirectoryForId(file.id);
      state.rangeSource = 0;
      state.rangeSourceLocked = false;
      state.rangeShapeIds = [];
      state.rangeStart = 0;
      state.rangeEnd = 0;
      state.rangeSegments = [];
      renderFileList();
      renderRangeControls();
      renderActionControls();
      loadFrameImage();
    }

    function selectRelativeFile(delta) {
      if (!state.files.length) return;
      selectFile(state.activeFile + delta, { scrollSource: true });
    }

    function clearCanvas(message) {
      stopPlayback();
      state.imageLoadSeq += 1;
      canvas.width = 1;
      canvas.height = 1;
      ctx.clearRect(0, 0, 1, 1);
      resetCanvasInteraction();
      clearSelection();
      frameSlider.disabled = true;
      playBtn.disabled = true;
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      topbar.classList.add('static');
      frameText.textContent = '0 / 0';
      frameKindText.textContent = '图片';
      motionPreview.removeAttribute('src');
      previewHint.textContent = '静态';
      shapeList.innerHTML = '<div class="muted">没有可编辑帧</div>';
      statusEl.textContent = message;
      renderRangeControls();
      renderActionControls();
    }

    function loadFrameImage() {
      const file = currentFile();
      if (!file) {
        clearCanvas('没有帧');
        return;
      }
      const frameUrl = file.frames[state.frame];
      if (!frameUrl) {
        clearCanvas('当前文件没有可显示帧');
        return;
      }
      const loadSeq = ++state.imageLoadSeq;
      statusEl.textContent = `${file.name}`;
      frameText.textContent = `${state.frame + 1} / ${file.frameCount}`;
      frameKindText.textContent = fileKindText(file);
      previewHint.textContent = isSingleFrame(file) ? '静态' : (state.playing ? '播放中' : '');
      motionPreview.src = frameUrl;
      topbar.classList.toggle('static', isSingleFrame(file));
      const image = new Image();
      image.decoding = 'async';
      state.image = image;
      image.onload = () => {
        if (loadSeq !== state.imageLoadSeq) return;
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        renderShapeList();
        renderActionControls();
        draw();
      };
      image.onerror = () => {
        if (loadSeq !== state.imageLoadSeq) return;
        clearCanvas('帧加载失败，请刷新列表后重试');
      };
      image.src = frameUrl;
    }

    function activeIdsFromWorkspace() {
      const ids = new Set();
      if (!state.workspace) return ids;
      for (const source of state.workspace.sourceFiles) {
        if (source.active) ids.add(source.id);
      }
      for (const file of state.workspace.frames) {
        if (file.active) ids.add(file.id);
      }
      return ids;
    }

    function applyActiveFilesToWorkspace(nextIds) {
      if (!state.workspace) return;
      const activeIds = new Set([...nextIds].filter(Boolean));
      for (const source of state.workspace.sourceFiles || []) {
        source.active = activeIds.has(source.id);
      }
      for (const file of state.workspace.frames || []) {
        file.active = activeIds.has(file.id);
      }
      state.workspace.activeFiles = [...activeIds].sort();
      state.workspace.activeFilesConfigured = true;
    }

    function manifestFromWorkspace(workspace = state.workspace) {
      const activeFilesConfigured = Boolean(workspace?.activeFilesConfigured);
      const activeFiles = new Set(workspace?.activeFiles || []);
      const files = [];
      for (const record of workspace?.frames || []) {
        if (activeFilesConfigured && !activeFiles.has(record.id)) continue;
        files.push({
          id: record.id,
          name: record.sourceName || record.name,
          kind: record.kind,
          frameCount: record.frameCount,
          durations: record.durations || Array.from({ length: record.frameCount }, () => 100),
          loop: Number(record.loop || 0),
          frames: record.frames || [],
          annotatedFrameCount: record.annotatedFrameCount,
          missingSource: record.missingSource
        });
      }
      return { files, annotationsPath: workspace?.annotationsPath || '' };
    }

    async function updateActiveFiles(nextIds) {
      const nextActiveIds = new Set([...nextIds].filter(Boolean));
      const previousActiveIds = activeIdsFromWorkspace();
      applyActiveFilesToWorkspace(nextActiveIds);
      applyWorkspaceAndManifest(state.workspace, manifestFromWorkspace());
      statusEl.textContent = '勾选列表已更新';
      try {
        await apiJson('/api/config', {
          method: 'POST',
          body: JSON.stringify({ activeFiles: [...nextActiveIds].sort(), activeOnly: true })
        });
        state.autoImportFailures.clear();
        scheduleAutoImport(120);
      } catch (error) {
        applyActiveFilesToWorkspace(previousActiveIds);
        applyWorkspaceAndManifest(state.workspace, manifestFromWorkspace());
        throw error;
      }
    }

    async function saveAnnotations(options = {}) {
      clearPendingAutoSave();
      state.savePromise = state.savePromise.catch(() => {}).then(async () => {
        const snapshot = annotationsSnapshot();
        if (snapshot === state.savedSnapshot) {
          setDirty(false, { autoSave: false });
          return { skipped: true, path: state.lastSavePath };
        }

        state.saving = true;
        state.saveError = false;
        updateSaveIndicator();
        try {
          const data = await apiJson('/api/annotations', {
            method: 'POST',
            body: snapshot
          });
          state.lastSavePath = data.path || '';
          state.savedSnapshot = snapshot;
          state.dirty = annotationsSnapshot() !== state.savedSnapshot;
          state.saveError = false;
          if (!options.quiet) {
            statusEl.textContent = state.lastSavePath ? `保存到 ${state.lastSavePath}` : '已保存';
          }
          return data;
        } catch (error) {
          state.saveError = true;
          state.dirty = true;
          throw error;
        } finally {
          state.saving = false;
          updateSaveIndicator();
          renderActionControls();
          if (state.dirty && !state.saveError) scheduleAutoSave(250);
        }
      });
      return state.savePromise;
    }

    function flushAutoSaveOnExit() {
      if (!state.dirty) return;
      clearPendingAutoSave();
      const snapshot = annotationsSnapshot();
      if (snapshot === state.savedSnapshot) return;
      const blob = new Blob([snapshot], { type: 'application/json' });
      if (navigator.sendBeacon && navigator.sendBeacon('/api/annotations', blob)) return;
      fetch('/api/annotations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: snapshot,
        keepalive: true
      }).catch(() => {});
    }

    async function saveDirectories(options = {}) {
      const sourceDir = sourceDirInput.value.trim();
      const outputDir = outputDirInput.value.trim();
      if (!sourceDir) return;
      if (!outputDir) return;
      const previousDir = state.workspace?.sourceDir || '';
      setBusy(true, options.message || '保存目录...');
      try {
        const data = await apiJson('/api/config', {
          method: 'POST',
          body: JSON.stringify({ sourceDir, outputDir })
        });
        applyWorkspaceAndManifest(data.workspace, data.manifest);
        const nextDir = data.workspace?.sourceDir || '';
        if (nextDir && nextDir !== previousDir) {
          await updateActiveFiles(new Set((data.workspace.sourceFiles || []).map(source => source.id)));
          statusEl.textContent = options.successText || '目录已保存，已选择当前图片';
        } else {
          state.autoImportFailures.clear();
          scheduleAutoImport(120);
          statusEl.textContent = options.successText || '目录已保存';
        }
      } finally {
        setBusy(false);
      }
    }

    async function pickDirectory(kind) {
      const isOutput = kind === 'output';
      const input = isOutput ? outputDirInput : sourceDirInput;
      setBusy(true, isOutput ? '选择导出目录...' : '选择图片目录...');
      try {
        const data = await apiJson('/api/select-directory', {
          method: 'POST',
          body: JSON.stringify({ kind, currentDir: input.value.trim() })
        });
        if (!data.path) {
          statusEl.textContent = '已取消选择目录';
          return;
        }
        input.value = data.path;
        await saveDirectories({
          message: isOutput ? '保存导出目录...' : '保存图片目录...',
          successText: isOutput ? '导出目录已保存' : '图片目录已保存'
        });
      } finally {
        setBusy(false);
      }
    }

    async function extractAssets(assetIds, overwrite = false, options = {}) {
      const ids = assetIds.filter(Boolean);
      if (!ids.length) {
        statusEl.textContent = '没有勾选文件';
        return;
      }
      const action = overwrite ? '刷新源图' : '导入源图';
      setBusy(true, options.auto ? `自动${action}...` : `${action}...`);
      try {
        const data = await apiJson('/api/extract', {
          method: 'POST',
          body: JSON.stringify({ assetIds: ids, overwrite })
        });
        const firstReady = data.results.find(item => ['imported', 'skipped'].includes(item.status));
        applyWorkspaceAndManifest(data.workspace, data.manifest, { preferredId: firstReady?.id });
        const okCount = data.results.filter(item => ['imported', 'skipped'].includes(item.status)).length;
        const failed = data.results.filter(item => !['imported', 'skipped'].includes(item.status));
        for (const item of failed) state.autoImportFailures.add(item.id);
        if (options.auto) {
          statusEl.textContent = failed.length
            ? `自动导入完成 ${okCount} 个，失败 ${failed.length} 个`
            : `自动导入完成 ${okCount} 个`;
        } else {
          const summary = data.results.map(item => `${item.id}:${item.status}`).join(' ');
          statusEl.textContent = summary || '导入完成';
        }
        return data;
      } finally {
        setBusy(false);
      }
    }

    function pendingAutoImportSources(sourceList = state.workspace?.sourceFiles || []) {
      const activeIds = activeIdsFromWorkspace();
      return sourceList.filter(source =>
        source &&
        source.active &&
        activeIds.has(source.id) &&
        (!source.imported || source.stale) &&
        !state.autoImportFailures.has(source.id)
      );
    }

    function scheduleAutoImport(delay = 250) {
      clearTimeout(state.autoImportTimer);
      if (!state.workspace || state.autoImporting) return;
      state.autoImportTimer = setTimeout(() => {
        runAutoImport().catch(showError);
      }, delay);
    }

    async function runAutoImport() {
      if (state.autoImporting || state.busy || !state.workspace) return;
      const pendingSources = pendingAutoImportSources();
      if (!pendingSources.length) return;
      state.autoImporting = true;
      try {
        await extractAssets(
          pendingSources.map(source => source.id),
          pendingSources.some(source => source.stale),
          { auto: true }
        );
      } finally {
        state.autoImporting = false;
      }
      if (pendingAutoImportSources().length) scheduleAutoImport(1200);
    }

    async function ensureSourcesReady(sourceList) {
      const pendingSources = sourceList.filter(source => source && (!source.imported || source.stale));
      if (!pendingSources.length) return;
      await extractAssets(
        pendingSources.map(source => source.id),
        pendingSources.some(source => source.stale),
        { auto: true }
      );
    }

    function basenamePath(path) {
      const parts = String(path || '').split(/[\\/]/).filter(Boolean);
      return parts[parts.length - 1] || path || '';
    }

    function sourceDirectoryParts(source) {
      const relativePath = String(source?.relativePath || source?.name || source?.baseName || '');
      const parts = relativePath.split(/[\\/]/).filter(Boolean);
      parts.pop();
      return parts;
    }

    function sourceDirectoryKey(source) {
      return sourceDirectoryParts(source).join('/') || '.';
    }

    function sourceDirectoryLabel(key) {
      return key === '.' ? '图片目录' : key;
    }

    function sourceDisplayName(source) {
      return source.baseName || basenamePath(source.relativePath || source.name || source.id);
    }

    function sourceMatchesFilter(source) {
      const completionMatches = state.sourceFilter === 'complete'
        ? isFileComplete(source.id)
        : state.sourceFilter === 'incomplete'
          ? !isFileComplete(source.id)
          : true;
      const kindMatches = state.sourceKindFilter === 'all' || source.kind === state.sourceKindFilter;
      return completionMatches && kindMatches;
    }

    function filteredSourceFiles() {
      return (state.workspace?.sourceFiles || []).filter(sourceMatchesFilter);
    }

    function sourceFilterEmptyText() {
      const completion = state.sourceFilter === 'complete'
        ? '已完成'
        : state.sourceFilter === 'incomplete'
          ? '未完成'
          : '';
      const kind = state.sourceKindFilter === 'animated'
        ? '动图'
        : state.sourceKindFilter === 'static'
          ? '静态图'
          : '';
      const label = [completion, kind].filter(Boolean).join(' · ');
      return label ? `没有${label}文件` : '没有文件';
    }

    function renderSourceFilter() {
      sourceFilter.querySelectorAll('button').forEach(button => {
        const active = button.dataset.filter === state.sourceFilter;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      sourceKindFilter.querySelectorAll('button').forEach(button => {
        const active = button.dataset.kind === state.sourceKindFilter;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      animatedFormatControl.querySelectorAll('button').forEach(button => {
        const active = button.dataset.format === state.animatedFormat;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }

    function sourceStatus(source) {
      const annotated = countAnnotatedFrames(source.id);
      const completion = fileCompletionLabel(source.id);
      if (state.autoImportFailures.has(source.id)) {
        return { text: '导入失败', className: 'warn' };
      }
      if (source.active && !source.imported) {
        return { text: '自动导入', className: 'changed' };
      }
      if (source.imported && source.stale) {
        return { text: '自动刷新', className: 'warn' };
      }
      if (source.imported && completion) {
        return { text: completion, className: 'complete' };
      }
      if (source.imported && annotated) {
        return { text: `已标 ${annotated}/${source.frameCount}`, className: 'changed' };
      }
      return null;
    }

    function emptySourceTreeNode(key, name, depth) {
      return {
        key,
        name,
        depth,
        dirs: new Map(),
        sources: [],
        sourceIds: [],
        sourceCount: 0,
        importedCount: 0,
        completedCount: 0,
        activeCount: 0
      };
    }

    function buildSourceTree(sources = filteredSourceFiles()) {
      const root = emptySourceTreeNode('.', '图片目录', -1);
      for (const source of sources) {
        const parts = sourceDirectoryParts(source);
        let node = root;
        for (let index = 0; index < parts.length; index += 1) {
          const key = parts.slice(0, index + 1).join('/');
          if (!node.dirs.has(parts[index])) {
            node.dirs.set(parts[index], emptySourceTreeNode(key, parts[index], index));
          }
          node = node.dirs.get(parts[index]);
        }
        node.sources.push(source);
      }

      function finalize(node) {
        node.dirs = [...node.dirs.values()].sort((a, b) => a.name.localeCompare(b.name));
        node.sources.sort((a, b) => sourceDisplayName(a).localeCompare(sourceDisplayName(b)));
        node.sourceIds = node.sources.map(source => source.id);
        node.sourceCount = node.sources.length;
        node.importedCount = node.sources.filter(source => source.imported).length;
        node.completedCount = node.sources.filter(source => isFileComplete(source.id)).length;
        node.activeCount = node.sources.filter(source => source.active).length;
        for (const child of node.dirs) {
          finalize(child);
          node.sourceIds.push(...child.sourceIds);
          node.sourceCount += child.sourceCount;
          node.importedCount += child.importedCount;
          node.completedCount += child.completedCount;
          node.activeCount += child.activeCount;
        }
        return node;
      }

      return finalize(root);
    }

    function renderExportResults(results, outputDir = '') {
      exportStatus.innerHTML = '';
      if (outputDir) {
        const outputLine = document.createElement('div');
        outputLine.className = 'export-line export-path';
        outputLine.title = outputDir;
        const label = document.createElement('strong');
        label.textContent = '输出';
        const path = document.createElement('span');
        path.textContent = outputDir;
        outputLine.append(label, path);
        exportStatus.appendChild(outputLine);
      }
      if (!results?.length) return;

      const rendered = results.filter(result => result.status === 'rendered');
      const failed = results.filter(result => result.status !== 'rendered');
      const formatCounts = rendered.reduce((counts, result) => {
        const format = String(result.format || '').toUpperCase() || '文件';
        counts[format] = (counts[format] || 0) + 1;
        return counts;
      }, {});

      const summary = document.createElement('div');
      summary.className = 'export-summary';
      const title = document.createElement('strong');
      title.textContent = failed.length
        ? `导出完成：成功 ${rendered.length}，失败 ${failed.length}`
        : `导出完成：成功 ${rendered.length}`;
      const detail = document.createElement('span');
      const formatText = Object.entries(formatCounts)
        .map(([format, count]) => `${format} ${count}`)
        .join(' · ');
      const totalBytes = rendered.reduce((total, result) => total + Number(result.size || 0), 0);
      detail.textContent = [formatText, totalBytes ? `总大小 ${formatBytes(totalBytes)}` : '']
        .filter(Boolean)
        .join(' · ');
      summary.append(title, detail);
      exportStatus.appendChild(summary);

      if (failed.length) {
        const failure = document.createElement('div');
        failure.className = 'export-summary export-failure';
        const failureTitle = document.createElement('strong');
        failureTitle.textContent = '失败文件';
        const names = failed.slice(0, 6).map(result => sourceDisplayName({
          baseName: basenamePath(result.outputName || result.id),
          id: result.id,
        }) + (result.error ? `（${result.error}）` : ''));
        const failureDetail = document.createElement('span');
        failureDetail.textContent = `${names.join('、')}${failed.length > names.length ? ` 等 ${failed.length} 个` : ''}`;
        failureDetail.title = failed
          .map(result => `${result.id}: ${result.error || result.status || '导出失败'}`)
          .join('\n');
        failure.append(failureTitle, failureDetail);
        exportStatus.appendChild(failure);
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function renderExportProgress(job, startedAt = Date.now()) {
      const total = Number(job?.total || 0);
      const done = Number(job?.done || 0);
      const current = job?.current || '';
      const percent = total ? Math.min(100, Math.round(done / total * 100)) : 0;
      const elapsed = Math.max(0, Math.round((Date.now() - startedAt) / 1000));
      const format = String(job?.animatedFormat || state.animatedFormat || '').toUpperCase();
      const targetBytes = job && Object.prototype.hasOwnProperty.call(job, 'maxBytes')
        ? job.maxBytes
        : exportTargetBytes();
      const compressionLabel = targetBytes
        ? ` · ≤${formatExportMB(Number(targetBytes) / 1024 / 1024)} MB`
        : ' · 不限体积';
      const title = job?.status === 'queued'
        ? '等待导出'
        : `正在导出${format ? ` · ${format}` : ''}${compressionLabel}`;
      const detail = current
        ? `当前：${basenamePath(current)}`
        : (job?.status === 'queued' ? '等待压缩器启动' : '压缩器启动中');
      const avifHint = String(job?.animatedFormat || state.animatedFormat || '').toLowerCase() === 'avif' && elapsed >= 12
        ? ' · AVIF 较慢，追求速度可切 WebP'
        : '';
      exportStatus.innerHTML = `
        <div class="export-progress">
          <div class="export-progress-head">
            <strong>${title}</strong>
            <span>${done}/${total || '-'}</span>
          </div>
          <div class="export-progress-bar"><div class="export-progress-fill" style="width:${percent}%"></div></div>
          <div class="muted">${detail} · ${elapsed}s${avifHint}</div>
        </div>
      `;
    }

    async function waitForExportJob(jobId, startedAt) {
      while (true) {
        const data = await apiJson(`/api/render/status?jobId=${encodeURIComponent(jobId)}`);
        const job = data.job;
        renderExportProgress(job, startedAt);
        if (job.status === 'done') return job;
        if (job.status === 'error') throw new Error(job.error || '导出失败');
        await sleep(1000);
      }
    }

    async function startExportRender(ids, startedAt, maxBytes, animatedFormat) {
      const request = {
        method: 'POST',
        body: JSON.stringify({
          assetIds: ids,
          maxBytes,
          animatedFormat
        })
      };
      try {
        const data = await apiJson('/api/render/start', request);
        return { mode: 'job', data };
      } catch (error) {
        if (error.status !== 404) throw error;
        renderExportProgress({
          status: 'running',
          total: ids.length,
          done: 0,
          current: '旧服务同步压缩中',
          maxBytes,
          animatedFormat
        }, startedAt);
        const timer = setInterval(() => {
          renderExportProgress({
            status: 'running',
            total: ids.length,
            done: 0,
            current: '旧服务同步压缩中',
            maxBytes,
            animatedFormat
          }, startedAt);
        }, 1000);
        try {
          const data = await apiJson('/api/render', request);
          return { mode: 'sync', data };
        } finally {
          clearInterval(timer);
        }
      }
    }

    async function exportSources(sources, options = {}) {
      const sourcesToExport = sources.filter(Boolean);
      const ids = sourcesToExport.map(source => source.id);
      if (!ids.length) return;

      const progressText = options.progressText || `准备导出 ${ids.length} 个文件...`;
      setBusy(true, progressText);
      const startedAt = Date.now();
      const maxBytes = exportTargetBytes();
      const animatedFormat = state.animatedFormat;
      renderExportProgress({ status: 'queued', total: ids.length, done: 0, maxBytes, animatedFormat }, startedAt);
      try {
        await saveAnnotations({ quiet: true });
        const started = await startExportRender(ids, startedAt, maxBytes, animatedFormat);
        const job = started.mode === 'job' ? await waitForExportJob(started.data.jobId, startedAt) : null;
        const results = job ? (job.results || []) : (started.data.results || []);
        const outputDir = job?.outputDir || started.data?.job?.outputDir || started.data?.outputDir || '';
        renderExportResults(results, outputDir);
        const okCount = results.filter(item => item.status === 'rendered').length;
        const failedCount = results.length - okCount;
        if (failedCount) {
          statusEl.textContent = `导出完成 ${okCount} 个，失败 ${failedCount} 个`;
        } else if (options.successText) {
          statusEl.textContent = options.successText(okCount, outputDir);
        } else {
          statusEl.textContent = `已导出 ${okCount} 个文件${outputDir ? ` · ${basenamePath(outputDir)}` : ''}`;
        }
      } finally {
        setBusy(false);
      }
    }

    function sourceExportBlocker(source) {
      if (!source) return '没有可导出的图片';
      if (!source.imported) return '自动导入失败，无法导出';
      if (source.stale) return '自动刷新失败，无法导出';
      return '';
    }

    async function exportSingleSource(sourceId) {
      let source = (state.workspace?.sourceFiles || []).find(item => item.id === sourceId);
      if (source && (!source.imported || source.stale)) {
        await ensureSourcesReady([source]);
        source = (state.workspace?.sourceFiles || []).find(item => item.id === sourceId);
      }
      const blocker = sourceExportBlocker(source);
      if (blocker) {
        statusEl.textContent = blocker;
        return;
      }
      const name = sourceDisplayName(source);
      await exportSources([source], {
        progressText: `准备导出 ${name}...`,
        successText: (_okCount, outputDir) => `已导出 ${name}${outputDir ? ` · ${basenamePath(outputDir)}` : ''}`
      });
    }

    async function exportSelectedAssets() {
      const activeIds = activeIdsFromWorkspace();
      let activeSources = (state.workspace?.sourceFiles || []).filter(source => activeIds.has(source.id));
      let completedSources = activeSources.filter(source => isFileComplete(source.id));
      await ensureSourcesReady(completedSources);
      activeSources = (state.workspace?.sourceFiles || []).filter(source => activeIds.has(source.id));
      completedSources = activeSources.filter(source => isFileComplete(source.id));
      const exportSources = completedSources.filter(source => source.imported && !source.stale);
      const ids = exportSources.map(source => source.id);
      if (!ids.length) {
        if (!activeSources.length) {
          statusEl.textContent = '没有勾选文件';
        } else if (!completedSources.length) {
          statusEl.textContent = '没有已完成文件';
        } else if (completedSources.some(source => source.stale)) {
          statusEl.textContent = '自动刷新失败，无法导出';
        } else if (completedSources.some(source => !source.imported)) {
          statusEl.textContent = '自动导入失败，无法导出';
        } else {
          statusEl.textContent = '没有可导出的已完成文件';
        }
        return;
      }
      await exportSources(exportSources, {
        progressText: `准备导出 ${ids.length} 个已完成文件...`,
        successText: (okCount, outputDir) => `已导出 ${okCount} 个已完成文件${outputDir ? ` · ${basenamePath(outputDir)}` : ''}`
      });
    }

    function renderDirectoryMeta() {
      if (!state.workspace) return;
      const sourceCount = state.workspace.sourceFiles.length;
      const activeCount = state.workspace.sourceFiles.filter(source => source.active).length;
      const allActive = sourceCount > 0 && activeCount === sourceCount;
      renderSourceFilter();
      directoryMeta.textContent = '';
      selectAllSourcesBtn.textContent = allActive ? '取消全选' : '勾选全部';
      selectAllSourcesBtn.title = allActive ? '取消勾选全部图片' : '勾选当前目录下全部图片';
    }

    function expandSourceDirectoryForId(sourceId) {
      const source = state.workspace?.sourceFiles.find(item => item.id === sourceId);
      if (!source) return;
      const parts = sourceDirectoryParts(source);
      for (let index = 1; index <= parts.length; index += 1) {
        state.sourceCollapsedDirs.delete(parts.slice(0, index).join('/'));
      }
    }

    function renderSourceFileItem(source, depth) {
      const item = document.createElement('div');
      const fileIndex = fileIndexForSource(source.id);
      const isCurrent = fileIndex >= 0 && fileIndex === state.activeFile;
      const canOpen = fileIndex >= 0;
      item.className = `source-tree-row file source-item kind-${source.kind}${canOpen ? ' selectable' : ''}${isCurrent ? ' current' : ''}`;
      item.style.setProperty('--tree-indent', `${depth * 14}px`);
      item.dataset.sourceId = source.id;
      item.title = source.relativePath || source.name || source.id;
      if (canOpen) {
        item.addEventListener('click', evt => {
          if (evt.target.closest('button, input')) return;
          selectFile(fileIndex);
        });
      }

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'source-tree-check';
      checkbox.checked = source.active;
      checkbox.disabled = state.busy;
      checkbox.title = '勾选后自动导入，导出时仍只导出已完成文件';
      checkbox.addEventListener('click', evt => evt.stopPropagation());
      checkbox.addEventListener('change', () => {
        const next = activeIdsFromWorkspace();
        if (checkbox.checked) next.add(source.id);
        else next.delete(source.id);
        updateActiveFiles(next).catch(showError);
      });

      const info = document.createElement('div');
      info.className = 'source-file-main';
      const name = document.createElement('div');
      name.className = 'source-name';
      name.textContent = sourceDisplayName(source);

      const meta = document.createElement('div');
      meta.className = 'source-meta';
      const metaBase = document.createElement('span');
      metaBase.className = 'source-meta-base';
      metaBase.textContent = `${sourceKindLabel(source.kind)} · ${formatBytes(source.size)}`;
      meta.appendChild(metaBase);
      const status = sourceStatus(source);
      if (status) {
        const statusEl = document.createElement('span');
        statusEl.className = `source-status ${status.className}`;
        statusEl.textContent = status.text;
        meta.appendChild(statusEl);
      }
      info.append(name, meta);

      const commands = document.createElement('div');
      commands.className = 'source-commands';

      const exportButton = document.createElement('button');
      exportButton.className = 'small-btn source-command';
      exportButton.type = 'button';
      exportButton.disabled = state.busy || Boolean(sourceExportBlocker(source));
      exportButton.textContent = '导出';
      exportButton.title = sourceExportBlocker(source) || '只导出这张图片';
      exportButton.addEventListener('click', evt => {
        evt.stopPropagation();
        exportSingleSource(source.id).catch(showError);
      });

      commands.append(exportButton);
      item.append(checkbox, info, commands);
      return item;
    }

    function toggleSourceFolder(node) {
      if (state.sourceCollapsedDirs.has(node.key)) state.sourceCollapsedDirs.delete(node.key);
      else state.sourceCollapsedDirs.add(node.key);
      renderSourceFileList();
    }

    function setSourceTreeActive(node, active) {
      const next = activeIdsFromWorkspace();
      for (const id of node.sourceIds) {
        if (active) next.add(id);
        else next.delete(id);
      }
      updateActiveFiles(next).catch(showError);
    }

    function renderSourceFolderNode(node, depth, fragment) {
      const collapsed = state.sourceCollapsedDirs.has(node.key);
      const row = document.createElement('div');
      row.className = 'source-tree-row folder';
      row.style.setProperty('--tree-indent', `${depth * 14}px`);
      row.title = sourceDirectoryLabel(node.key);
      row.addEventListener('click', evt => {
        if (evt.target.closest('button, input')) return;
        toggleSourceFolder(node);
      });

      const caret = document.createElement('button');
      caret.className = 'source-caret';
      caret.type = 'button';
      caret.setAttribute('aria-expanded', String(!collapsed));
      caret.title = collapsed ? '展开目录' : '折叠目录';
      caret.disabled = state.busy;
      caret.addEventListener('click', evt => {
        evt.stopPropagation();
        toggleSourceFolder(node);
      });

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'source-tree-check';
      checkbox.checked = node.sourceCount > 0 && node.activeCount === node.sourceCount;
      checkbox.indeterminate = node.activeCount > 0 && node.activeCount < node.sourceCount;
      checkbox.disabled = state.busy || node.sourceCount === 0;
      checkbox.title = '勾选或取消这个目录下的所有图片';
      checkbox.addEventListener('click', evt => evt.stopPropagation());
      checkbox.addEventListener('change', () => {
        setSourceTreeActive(node, checkbox.checked);
      });

      const main = document.createElement('div');
      main.className = 'source-folder-main';
      const name = document.createElement('div');
      name.className = 'source-folder-name';
      name.textContent = node.name;
      const meta = document.createElement('div');
      meta.className = 'source-folder-meta';
      meta.textContent = '';
      main.append(name, meta);

      const count = document.createElement('div');
      count.className = 'source-folder-meta';
      count.textContent = '';

      row.append(caret, checkbox, main, count);
      fragment.appendChild(row);

      if (collapsed) return;
      for (const child of node.dirs) {
        renderSourceFolderNode(child, depth + 1, fragment);
      }
      for (const source of node.sources) {
        fragment.appendChild(renderSourceFileItem(source, depth + 1));
      }
    }

    function renderSourceFileList() {
      if (!state.workspace?.sourceFiles.length) {
        const empty = document.createElement('div');
        empty.className = 'muted';
        empty.textContent = '图片目录下没有支持的图片文件';
        sourceFileList.replaceChildren(empty);
        return;
      }

      const sources = filteredSourceFiles();
      if (!sources.length) {
        const empty = document.createElement('div');
        empty.className = 'muted';
        empty.textContent = sourceFilterEmptyText();
        sourceFileList.replaceChildren(empty);
        return;
      }

      const tree = document.createElement('div');
      tree.className = 'source-tree';
      const fragment = document.createDocumentFragment();
      const root = buildSourceTree(sources);
      for (const child of root.dirs) {
        renderSourceFolderNode(child, 0, fragment);
      }
      for (const source of root.sources) {
        fragment.appendChild(renderSourceFileItem(source, 0));
      }
      tree.appendChild(fragment);
      sourceFileList.replaceChildren(tree);

      if (state.scrollSourceIntoView) {
        state.scrollSourceIntoView = false;
        requestAnimationFrame(() => {
          sourceFileList.querySelector('.source-item.current')?.scrollIntoView({
            block: 'nearest',
            inline: 'nearest'
          });
        });
      }
    }

    function renderFileList() {
      renderSourceFileList();
    }

    function renderShapeList() {
      const shapes = readFrameShapes();
      shapeList.innerHTML = '';
      if (!shapes.length) {
        const empty = document.createElement('div');
        empty.className = 'muted';
        empty.textContent = '本帧还没有区域';
        shapeList.appendChild(empty);
        renderRangeControls();
        return;
      }
      shapes.forEach((shape, index) => {
        const item = document.createElement('div');
        const active = isShapeSelected(shape);
        item.className = `shape-item${active ? ' active' : ''}`;
        item.textContent = `${index + 1}. ${shapeLabel(shape)} ${shape.points.length} 点`;
        if (active && isRangeShape(shape)) {
          const role = document.createElement('span');
          role.className = 'shape-role';
          role.textContent = '范围对象';
          item.appendChild(role);
        }
        item.addEventListener('click', evt => {
          selectRangeShape(shape, {
            additive: evt.ctrlKey || evt.metaKey,
            range: evt.shiftKey
          });
          renderShapeList();
          renderRangeControls();
          draw();
        });
        shapeList.appendChild(item);
      });
      renderRangeControls();
    }

    function drawShape(shape, opts = {}) {
      const isPreview = opts.preview || opts.rangePreview;
      const selected = isShapeSelected(shape) || opts.preview;
      const styles = getComputedStyle(document.documentElement);
      const isDraftPolygon = shape.type === 'polygon' && opts.preview;
      const polygonPoints = isDraftPolygon && shape.previewPoint
        ? [...shape.points, shape.previewPoint]
        : (shape.points || []);
      ctx.save();
      ctx.lineWidth = selected ? 3 : 2;
      ctx.strokeStyle = isPreview ? styles.getPropertyValue('--preview') : styles.getPropertyValue('--shape');
      ctx.fillStyle = isPreview ? 'rgba(37, 99, 235, 0.18)' : 'rgba(225, 29, 72, 0.22)';
      if (opts.rangePreview || isDraftPolygon) ctx.setLineDash([8, 5]);
      ctx.beginPath();
      if (shape.type === 'rect') {
        const [a, b] = shape.points;
        const x = Math.min(a.x, b.x);
        const y = Math.min(a.y, b.y);
        const w = Math.abs(b.x - a.x);
        const h = Math.abs(b.y - a.y);
        ctx.rect(x, y, w, h);
      } else {
        polygonPoints.forEach((point, index) => {
          if (index === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        });
        if (polygonPoints.length >= 3) ctx.closePath();
      }
      if (shape.type === 'rect' || polygonPoints.length >= 3) ctx.fill();
      ctx.stroke();
      if (isDraftPolygon && shape.points.length >= 3) {
        const first = shape.points[0];
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(first.x, first.y, handleRadius() + 2, 0, Math.PI * 2);
        ctx.strokeStyle = styles.getPropertyValue('--mint');
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      if (selected && !opts.rangePreview) {
        const handles = shape.type === 'rect' ? rectCorners(shape) : polygonHandles(shape);
        const radius = shape.type === 'rect' ? handleRadius() : 4;
        for (const point of handles) {
          ctx.beginPath();
          ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.strokeStyle = '#111827';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function draw() {
      if (!currentFile() || !state.image.complete || !canvas.width) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(state.image, 0, 0);
      for (const shape of readFrameShapes()) drawShape(shape);
      for (const shape of rangePreviewShapes()) drawShape(shape, { rangePreview: true });
      if (state.drawing) drawShape(state.drawing, { preview: true });
    }

    function deleteSelected() {
      const selected = new Set(selectedIds());
      if (!selected.size) return;
      const shapes = frameShapes();
      const deleted = shapes.filter(shape => selected.has(shape.id));
      if (!deleted.length) return;
      pushHistory(deleted.length > 1 ? '删除多个区域' : '删除区域');
      markCurrentFileEdited();
      const next = shapes.filter(shape => !selected.has(shape.id));
      const store = fileStore();
      store.frames[String(state.frame)] = next;
      const deletedKeys = new Set();
      deleted.forEach(shape => {
        deletedKeys.add(shape.id);
        deletedKeys.add(shapeTrackId(shape));
      });
      state.rangeShapeIds = state.rangeShapeIds.filter(id => !deletedKeys.has(id));
      state.selectedId = null;
      state.selectedIds = [];
      state.selectionAnchorId = null;
      setDirty(true);
      renderShapeList();
      draw();
    }

    function cloneShapeForClipboard(shape) {
      return {
        type: shape.type,
        effect: shape.effect,
        blockSize: shape.blockSize,
        points: shape.points.map(point => ({ ...point }))
      };
    }

    function copySelectedShapes() {
      const shapes = selectedFrameShapes();
      if (!shapes.length) {
        statusEl.textContent = '没有选中的区域';
        return;
      }
      state.shapeClipboard = shapes.map(cloneShapeForClipboard);
      renderRangeControls();
      statusEl.textContent = `已复制 ${state.shapeClipboard.length} 个区域`;
    }

    function pasteCopiedShapes() {
      if (!currentFile()) return;
      if (!state.shapeClipboard.length) {
        statusEl.textContent = '剪贴板为空';
        return;
      }
      pushHistory(state.shapeClipboard.length > 1 ? '粘贴多个区域' : '粘贴区域');
      markCurrentFileEdited();
      const pasted = state.shapeClipboard.map(shape => {
        const id = uid();
        return {
          ...shape,
          id,
          trackId: id,
          points: shape.points.map(point => ({ ...point }))
        };
      });
      frameShapes().push(...pasted);
      selectRangeShapes(pasted, {
        anchorId: pasted[0]?.id || null,
        primaryId: pasted[pasted.length - 1]?.id || null
      });
      setDirty(true);
      renderShapeList();
      renderRangeControls();
      draw();
      statusEl.textContent = `已粘贴 ${pasted.length} 个区域`;
    }

    function applyWorkspaceAndManifest(workspace, manifest, options = {}) {
      const currentId = currentFile()?.id;
      state.workspace = workspace;
      state.files = manifest?.files || manifestFromWorkspace(workspace).files || [];
      sourceDirInput.value = workspace.sourceDir || '';
      outputDirInput.value = workspace.outputDir || '';
      renderDirectoryMeta();

      if (!state.files.length) {
        state.activeFile = 0;
        renderFileList();
        clearCanvas('没有帧');
        return;
      }

      const preferredIndex = options.preferredId
        ? state.files.findIndex(file => file.id === options.preferredId)
        : -1;
      const nextIndex = preferredIndex >= 0
        ? preferredIndex
        : state.files.findIndex(file => file.id === currentId);
      state.activeFile = nextIndex >= 0 ? nextIndex : Math.min(state.activeFile, state.files.length - 1);
      renderFileList();
      selectFile(state.activeFile);
    }

    function showError(error) {
      statusEl.textContent = error.message;
      console.error(error);
      setBusy(false);
    }

    function releaseDrawingPointer(evt = null) {
      const pointerId = evt?.pointerId ?? state.drawingPointerId;
      if (pointerId !== null && pointerId !== undefined && canvas.hasPointerCapture(pointerId)) {
        canvas.releasePointerCapture(pointerId);
      }
      state.drawingPointerId = null;
    }

    function startDrawingAt(point, pointerId = null) {
      state.drawing = { id: 'draft', type: 'rect', points: [point, point], effect: 'pixelate', blockSize: 14 };
      state.pendingSelection = null;
      state.resizing = null;
      if (pointerId !== null && pointerId !== undefined) {
        state.drawingPointerId = pointerId;
        canvas.setPointerCapture(pointerId);
      }
    }

    function startPolygonAt(point) {
      state.drawing = {
        id: 'draft',
        type: 'polygon',
        points: [{ ...point }],
        previewPoint: { ...point },
        effect: 'pixelate',
        blockSize: 14
      };
      state.pendingSelection = null;
      state.resizing = null;
      statusEl.textContent = '多边形：继续点击加点，点击首点/双击/Enter 完成';
      draw();
    }

    function addPolygonPoint(point) {
      if (!state.drawing || state.drawing.type !== 'polygon') {
        startPolygonAt(point);
        return;
      }
      if (polygonCloseHit(point)) {
        finishPolygonDrawing();
        return;
      }
      const last = state.drawing.points[state.drawing.points.length - 1];
      if (last && Math.hypot(last.x - point.x, last.y - point.y) < 2) return;
      state.drawing.points.push({ ...point });
      state.drawing.previewPoint = { ...point };
      statusEl.textContent = `多边形：${state.drawing.points.length} 点`;
      draw();
    }

    function finishPolygonDrawing(evt = null) {
      if (!state.drawing || state.drawing.type !== 'polygon') return;
      const points = state.drawing.points.map(point => ({ ...point }));
      if (polygonLargeEnough(points)) {
        const id = uid();
        const shape = {
          id,
          trackId: id,
          type: 'polygon',
          points,
          effect: 'pixelate',
          blockSize: 14
        };
        pushHistory('新增多边形');
        markCurrentFileEdited();
        frameShapes().push(shape);
        selectRangeShape(shape, { additive: true });
        setDirty(true);
        statusEl.textContent = `已新增多边形 · ${points.length} 点`;
      } else {
        statusEl.textContent = '多边形至少需要 3 个有效点';
      }
      resetCanvasInteraction();
      releaseDrawingPointer(evt);
      renderShapeList();
      draw();
    }

    function finishDrawing(evt) {
      if (!state.drawing) return;
      if (state.drawing.type === 'polygon') {
        finishPolygonDrawing(evt);
        return;
      }
      const [a, b] = state.drawing.points;
      if (rectLargeEnough(a, b)) {
        const id = uid();
        const shape = {
          ...state.drawing,
          id,
          trackId: id,
          points: state.drawing.points.map(p => ({ ...p }))
        };
        pushHistory('新增矩形');
        markCurrentFileEdited();
        frameShapes().push(shape);
        selectRangeShape(shape, { additive: true });
        setDirty(true);
      }
      resetCanvasInteraction();
      releaseDrawingPointer(evt);
      renderShapeList();
      draw();
    }

    function beginResize(handle, evt) {
      const { shape } = handle;
      const control = handle.handle || handle.corner;
      if (!isShapeSelected(shape)) {
        selectRangeShape(shape, {
          additive: evt.ctrlKey || evt.metaKey,
          range: evt.shiftKey
        });
      }
      if (shape.type === 'rect') {
        state.resizing = {
          mode: 'rect-corner',
          shapeId: shape.id,
          fixed: oppositeCorner(control.key, shape),
          pointerId: evt.pointerId,
          changed: false
        };
      } else {
        state.resizing = {
          mode: 'polygon-point',
          shapeId: shape.id,
          pointIndex: control.pointIndex,
          pointerId: evt.pointerId,
          changed: false
        };
      }
      state.drawing = null;
      state.pendingSelection = null;
      state.drawingPointerId = evt.pointerId;
      canvas.setPointerCapture(evt.pointerId);
      canvas.style.cursor = control.cursor;
      renderShapeList();
      renderRangeControls();
      draw();
    }

    function updateResize(point) {
      const active = state.resizing;
      if (!active) return;
      const shape = readFrameShapes().find(item => item.id === active.shapeId);
      if (!shape || !isRangeShape(shape)) return;
      const nextPoint = { x: point.x, y: point.y };
      if (active.mode === 'rect-corner') {
