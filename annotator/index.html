<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Mosaic</title>
  <link rel="icon" type="image/png" href="/assets/motion-mosaic-icon.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --line: #d8dee8;
      --text: #1f2933;
      --muted: #64748b;
      --accent: #0f766e;
      --accent-weak: #d9f2ee;
      --warn: #a16207;
      --warn-bg: #fff7d6;
      --danger: #b42318;
      --shape: #e11d48;
      --preview: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button, input {
      font: inherit;
    }

    button:disabled, input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .app {
      display: grid;
      grid-template-columns: 330px minmax(420px, 1fr) 320px;
      height: 100vh;
      min-width: 1120px;
    }

    aside, main, .right {
      min-height: 0;
    }

    aside, .right {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 12px;
      overflow: auto;
    }

    .right {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    h1, h2 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 650;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .input {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 8px;
      color: var(--text);
      background: #fff;
    }

    .file-btn, .tool-btn, .small-btn, .icon-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      min-height: 34px;
    }

    .file-btn {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 8px;
      text-align: left;
    }

    .file-btn.active, .tool-btn.active {
      border-color: var(--accent);
      background: var(--accent-weak);
      color: #064e45;
    }

    .file-meta {
      display: block;
      color: var(--muted);
      margin-top: 3px;
      font-size: 12px;
      line-height: 1.35;
    }

    main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      padding: 12px;
    }

    .topbar, .statusbar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
    }

    .topbar input[type="range"] {
      flex: 1;
      min-width: 240px;
    }

    .small-btn {
      padding: 0 10px;
      white-space: nowrap;
    }

    .small-btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .small-btn.danger {
      border-color: #f3b4ae;
      color: var(--danger);
    }

    .icon-btn {
      width: 34px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-weight: 650;
    }

    .workspace {
      display: grid;
      place-items: center;
      min-height: 0;
      overflow: auto;
      background: #e8edf3;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 150px);
      background: #111827;
      box-shadow: 0 1px 5px rgba(15, 23, 42, 0.16);
      cursor: crosshair;
      touch-action: none;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .tool-btn {
      padding: 8px 10px;
    }

    .group {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .range-panel {
      display: grid;
      gap: 10px;
    }

    .range-readout {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .range-metric {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f8fafc;
      padding: 7px 8px;
      min-width: 0;
    }

    .range-metric.source-metric {
      grid-column: 1 / -1;
    }

    .range-metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .range-metric strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.35;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .range-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .range-timeline {
      position: relative;
      height: 54px;
      margin: 2px 8px 0;
      touch-action: none;
    }

    .range-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 25px;
      height: 10px;
      border-radius: 999px;
      background: #dce3ed;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.12);
      cursor: pointer;
    }

    .range-selection {
      position: absolute;
      top: 0;
      bottom: 0;
      min-width: 8px;
      border-radius: 999px;
      background: var(--accent);
      z-index: 2;
    }

    .range-selection.draft {
      background: transparent;
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    .range-target-segment {
      position: absolute;
      top: 0;
      bottom: 0;
      min-width: 8px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.72);
      z-index: 1;
    }

    .range-current {
      position: absolute;
      top: 13px;
      width: 2px;
      height: 32px;
      background: var(--preview);
      transform: translateX(-1px);
      pointer-events: none;
    }

    .range-source {
      position: absolute;
      top: 8px;
      width: 3px;
      height: 42px;
      background: var(--warn);
      transform: translateX(-1px);
      pointer-events: none;
    }

    .range-handle {
      position: absolute;
      top: 11px;
      width: 24px;
      height: 38px;
      border: 2px solid var(--accent);
      border-radius: 999px;
      background: #fff;
      transform: translateX(-12px);
      cursor: ew-resize;
      box-shadow: 0 1px 5px rgba(15, 23, 42, 0.18);
    }

    .range-handle::after {
      content: attr(data-label);
      position: absolute;
      left: 50%;
      top: -15px;
      transform: translateX(-50%);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }

    .range-frame-strip {
      display: grid;
      gap: 1px;
      min-height: 28px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f1f5f9;
    }

    .range-frame {
      position: relative;
      min-width: 0;
      height: 22px;
      border: 0;
      border-radius: 2px;
      background: #dbe3ee;
      cursor: pointer;
      padding: 0;
    }

    .range-frame.in-range {
      background: #8fd3c9;
    }

    .range-frame.draft-range {
      box-shadow: inset 0 0 0 2px rgba(15, 118, 110, 0.5);
    }

    .range-frame.will-apply::before {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      top: 3px;
      height: 4px;
      border-radius: 999px;
      background: var(--preview);
    }

    .range-frame.has-shapes::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: 3px;
      height: 4px;
      border-radius: 999px;
      background: var(--shape);
    }

    .range-frame.current {
      outline: 2px solid var(--preview);
      outline-offset: 1px;
      z-index: 1;
    }

    .range-frame:disabled {
      cursor: default;
      opacity: 0.62;
    }

    .range-frame.source {
      box-shadow: inset 0 0 0 2px var(--warn);
    }

    .range-commit-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .source-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .source-list, .shape-list, .shortcut-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .source-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 8px;
    }

    .source-item input[type="checkbox"] {
      margin-top: 3px;
    }

    .source-name {
      font-weight: 600;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .source-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin-top: 3px;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      border: 1px solid var(--line);
      padding: 1px 7px;
      font-size: 12px;
      line-height: 18px;
      color: var(--muted);
      background: #fff;
    }

    .badge.ready {
      border-color: #9ad0c8;
      color: #075e55;
      background: #e7f7f4;
    }

    .badge.warn {
      border-color: #f3d47b;
      color: var(--warn);
      background: var(--warn-bg);
    }

    .shape-item {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 7px 8px;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .shape-item.active {
      border-color: var(--preview);
      box-shadow: inset 3px 0 0 var(--preview);
    }

    .shape-role {
      color: var(--preview);
      font-size: 12px;
      margin-left: 4px;
    }

    .shortcut-item {
      display: grid;
      grid-template-columns: 96px 1fr;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      color: var(--muted);
      font-size: 12px;
    }

    .shortcut-key {
      min-height: 28px;
      border: 1px solid #c9d2df;
      border-radius: 6px;
      background: #f8fafc;
      color: #243244;
      cursor: pointer;
      padding: 2px 6px;
      text-align: center;
      font-size: 12px;
      white-space: nowrap;
    }

    .shortcut-key.capturing {
      border-color: var(--preview);
      color: var(--preview);
      background: #eef5ff;
    }

    kbd {
      display: inline-block;
      min-width: 24px;
      border: 1px solid #c9d2df;
      border-bottom-color: #aab6c5;
      border-radius: 5px;
      padding: 2px 6px;
      background: #f8fafc;
      color: #243244;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 12px;
      text-align: center;
      box-shadow: inset 0 -1px 0 #d6dde8;
    }

    .key-pair {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .statusbar {
      justify-content: space-between;
      color: var(--muted);
      min-height: 38px;
    }

    .statusbar span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    body {
      background: #f3f5f4;
      font-size: 13px;
    }

    .app {
      grid-template-columns: 360px minmax(520px, 1fr) 300px;
      min-width: 1160px;
    }

    aside, .right {
      background: #fbfbfa;
      padding: 14px;
    }

    main {
      gap: 8px;
      padding: 10px;
    }

    h1, h2 {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: #353c43;
    }

    .panel-head, .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .panel-count {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source-field {
      display: grid;
      gap: 6px;
    }

    .source-field + .source-field {
      margin-top: 8px;
    }

    .input {
      border-color: #dce1dd;
      border-radius: 7px;
      min-height: 32px;
      padding: 6px 8px;
      background: #fff;
    }

    .path-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
    }

    .path-control .small-btn {
      min-width: 56px;
      padding: 0 8px;
    }

    .small-btn, .tool-btn, .icon-btn {
      border-color: #dce1dd;
      border-radius: 7px;
      min-height: 32px;
      background: #fff;
    }

    .small-btn.primary {
      background: #1f5e57;
      border-color: #1f5e57;
    }

    .topbar, .statusbar {
      border-color: #dce1dd;
      border-radius: 8px;
      background: #fbfbfa;
      padding: 7px 8px;
    }

    .frame-pill {
      min-width: 58px;
      color: #38424a;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .frame-kind-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      min-height: 24px;
      border-radius: 999px;
      background: #edf1ef;
      color: #58636c;
      padding: 0 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    .topbar.static input[type="range"] {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .topbar input[type="range"] {
      touch-action: none;
    }

    .workspace {
      border: 0;
      border-radius: 8px;
      background: #dfe5e4;
      padding: 10px;
    }

    canvas {
      max-height: calc(100vh - 130px);
      border-radius: 4px;
      box-shadow: 0 10px 28px rgba(21, 28, 35, 0.16);
    }

    .source-actions {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }

    .source-actions .small-btn {
      padding: 0 6px;
    }

    .source-actions .wide {
      grid-column: 1 / -1;
    }

    .source-format-control {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      grid-column: 1 / -1;
      min-height: 28px;
      color: var(--muted);
      font-size: 12px;
    }

    .source-format-control .source-filter {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .export-status {
      display: grid;
      gap: 4px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .export-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      border-top: 1px solid #edf0ed;
      padding-top: 5px;
    }

    .export-line.export-path {
      grid-template-columns: 58px minmax(0, 1fr);
    }

    .export-line.export-path span {
      white-space: normal;
      overflow-wrap: anywhere;
      text-overflow: clip;
    }

    .export-progress {
      display: grid;
      gap: 6px;
      border-top: 1px solid #edf0ed;
      padding-top: 7px;
    }

    .export-progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--ink);
      font-weight: 700;
    }

    .export-progress-bar {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf0ed;
    }

    .export-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 160ms ease;
    }

    .export-line strong, .export-line span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .export-summary {
      display: grid;
      gap: 3px;
      border-top: 1px solid #edf0ed;
      padding-top: 7px;
    }

    .export-summary strong {
      color: #20272d;
      font-size: 13px;
      line-height: 1.35;
    }

    .export-summary span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .export-failure {
      color: var(--danger);
    }

    .source-list {
      display: block;
      margin-top: 0;
    }

    .source-filter-bar {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .source-filter {
      display: inline-grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 2px;
      border: 1px solid #dfe5e1;
      border-radius: 999px;
      background: #eef2ef;
      padding: 2px;
    }

    .source-filter button {
      min-height: 22px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #65706c;
      padding: 0 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .source-filter button.active {
      background: #ffffff;
      color: #1f5e57;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
    }

    .source-tree {
      display: grid;
      gap: 1px;
    }

    .source-tree-row {
      --tree-indent: 0px;
      display: grid;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      border-radius: 6px;
      padding: 3px 6px 3px calc(6px + var(--tree-indent));
    }

    .source-tree-row.folder {
      grid-template-columns: 20px 18px minmax(0, 1fr) auto;
      border: 1px solid #edf1ee;
      background: #f6f8f6;
      color: #20272d;
      font-size: 12px;
      margin-top: 5px;
    }

    .source-tree-row.file {
      grid-template-columns: 18px minmax(0, 1fr) auto;
      border-top: 1px solid #f0f3f1;
      min-height: 34px;
    }

    .source-tree-row:hover {
      background: #f6f8f7;
    }

    .source-tree-row.current {
      background: #f2fbf8;
      box-shadow: inset 3px 0 0 #1f5e57;
    }

    .source-caret {
      width: 20px;
      height: 20px;
      min-height: 20px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #52615c;
      display: grid;
      place-items: center;
      padding: 0;
      line-height: 1;
      transition: background 140ms ease, color 140ms ease;
    }

    .source-caret::before {
      content: "";
      width: 6px;
      height: 6px;
      border-right: 1.7px solid currentColor;
      border-bottom: 1.7px solid currentColor;
      transform: rotate(-45deg);
      transition: transform 140ms ease;
    }

    .source-caret[aria-expanded="true"]::before {
      transform: rotate(45deg);
    }

    .source-caret:hover {
      background: #e7eeeb;
      color: #1f5e57;
    }

    .source-tree-check {
      width: 15px;
      height: 15px;
      margin: 0;
    }

    .source-tree-check {
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    .source-tree-row:hover .source-tree-check,
    .source-tree-row:focus-within .source-tree-check {
      opacity: 1;
      pointer-events: auto;
    }

    .source-folder-main, .source-file-main {
      min-width: 0;
    }

    .source-folder-name, .source-name {
      min-width: 0;
      overflow: hidden;
      color: #20272d;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source-folder-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }

    .source-folder-name::before {
      content: "";
      width: 11px;
      height: 8px;
      flex: 0 0 auto;
      border: 1.5px solid #789088;
      border-top-width: 4px;
      border-radius: 2px;
      opacity: 0.85;
    }

    .source-name {
      font-size: 13px;
      font-weight: 650;
    }

    .source-file-main {
      position: relative;
      padding-left: 10px;
    }

    .source-file-main::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4px;
      width: 4px;
      height: calc(100% - 8px);
      border-radius: 999px;
      background: #cfd8d3;
    }

    .source-tree-row.kind-animated .source-file-main::before {
      background: #6c8fd6;
    }

    .source-tree-row.kind-static .source-file-main::before {
      background: #9db3aa;
    }

    .source-folder-meta, .source-meta {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .source-meta-base {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .source-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 11px;
      line-height: 18px;
      font-weight: 650;
    }

    .source-status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
    }

    .source-status.complete {
      background: #e4f6ee;
      color: #0f7a5a;
    }

    .source-status.changed {
      background: #fff4d9;
      color: #9a6200;
    }

    .source-status.warn {
      background: #fff0e8;
      color: #b94a18;
    }

    .source-commands {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      min-width: 102px;
    }

    .source-command {
      min-width: 0;
      min-height: 26px;
      padding: 0 6px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    .source-commands .source-command {
      min-width: 48px;
    }

    .source-tree-row.file:hover .source-command,
    .source-tree-row.file:focus-within .source-command,
    .source-tree-row.current .source-command,
    .source-command.needed {
      opacity: 1;
      pointer-events: auto;
    }

    .group {
      border-top-color: #e3e7e3;
      margin-top: 12px;
      padding-top: 12px;
    }

    .right .group:first-of-type {
      margin-top: 10px;
    }

    .tool-grid {
      grid-template-columns: 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    .tool-btn {
      padding: 6px 8px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .action-grid .small-btn {
      padding: 0 8px;
    }

    .range-panel {
      gap: 8px;
    }

    .range-hint {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .range-readout {
      grid-template-columns: 1.2fr 0.8fr 0.8fr;
      gap: 5px;
    }

    .range-metric.source-metric {
      grid-column: auto;
    }

    .range-metric {
      border-color: #e3e7e3;
      background: #f7f8f6;
      padding: 6px 7px;
    }

    .range-actions {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .range-actions .small-btn, .range-commit-actions .small-btn {
      padding: 0 4px;
    }

    .range-frame-strip {
      border-color: #e3e7e3;
      background: #edf1ef;
    }

    .shortcut-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px 8px;
      margin-top: 8px;
    }

    .shortcut-item {
      grid-template-columns: 1fr;
      gap: 3px;
      min-height: 42px;
      align-content: start;
    }

    .shortcut-key {
      width: 100%;
      min-height: 28px;
      background: #f7f8f6;
    }

    .shortcut-item span:last-child {
      color: #5f6870;
      font-size: 12px;
    }

    kbd {
      min-width: 22px;
      border-radius: 5px;
      padding: 1px 5px;
      background: #f7f8f6;
      font-size: 11px;
      box-shadow: none;
    }

    .shape-list {
      margin-top: 8px;
    }

    .shape-item {
      border-color: #e3e7e3;
      border-radius: 7px;
      padding: 6px 8px;
    }

    #fileList[hidden] {
      display: none;
    }

    /* Motion Mosaic theme: quiet pixel charm, tuned from the app icon palette. */
    :root {
      --bg: #101821;
      --panel: #f4f0e8;
      --panel-soft: #fbf8f0;
      --panel-tint: #eaf2ee;
      --line: #c8d2cc;
      --line-strong: #172033;
      --ink: #172033;
      --text: #172033;
      --muted: #66727a;
      --accent: #1b5b64;
      --accent-strong: #123f4a;
      --accent-weak: #d7ece7;
      --mint: #8fd8c6;
      --blush: #f1bfd0;
      --lavender: #bca9ee;
      --cream: #f3e5aa;
      --warn: #8d6d1f;
      --warn-bg: #fbf0c8;
      --danger: #a93d58;
      --danger-weak: #f5d8df;
      --shape: #d95f8b;
      --preview: #7b6ed6;
      --dark-panel: #172033;
      --dark-panel-soft: #1b2b38;
    }

    ::selection {
      background: var(--mint);
      color: var(--line-strong);
    }

    body {
      background:
        linear-gradient(90deg, rgba(143, 216, 198, 0.055) 1px, transparent 1px),
        linear-gradient(0deg, rgba(246, 210, 220, 0.045) 1px, transparent 1px),
        var(--bg);
      background-size: 18px 18px;
      color: var(--text);
    }

    .app {
      background: var(--bg);
    }

    aside, .right {
      background: var(--panel);
      border-color: #273447;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.42);
    }

    main {
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        var(--bg);
      background-size: 16px 16px;
    }

    .app-head {
      min-height: 44px;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(23, 32, 51, 0.12);
    }

    .app-title {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .app-logo {
      width: 34px;
      height: 34px;
      image-rendering: pixelated;
      border-radius: 5px;
      box-shadow:
        0 0 0 1px rgba(23, 32, 51, 0.9),
        0 3px 0 rgba(23, 32, 51, 0.18);
      flex: 0 0 auto;
    }

    .app-title h1 {
      color: var(--line-strong);
      font-size: 13px;
      line-height: 1.15;
      letter-spacing: 0;
      text-transform: none;
    }

    .app-title span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }

    h2 {
      color: var(--line-strong);
    }

    label {
      color: #5d686d;
      font-weight: 650;
    }

    .input {
      background: var(--panel-soft);
      border-color: #bac8c1;
      border-radius: 5px;
      box-shadow: inset 0 1px 0 rgba(23, 32, 51, 0.04);
    }

    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(143, 216, 198, 0.45);
      outline: 0;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
    }

    .small-btn, .tool-btn, .icon-btn, .shortcut-key {
      background: var(--panel-soft);
      border-color: #bac8c1;
      border-radius: 5px;
      color: var(--text);
      box-shadow:
        inset 0 -2px 0 rgba(23, 32, 51, 0.06),
        0 1px 0 rgba(255, 255, 255, 0.7);
      transition: transform 80ms ease, border-color 120ms ease, background 120ms ease, color 120ms ease;
    }

    .small-btn:hover:not(:disabled),
    .tool-btn:hover:not(:disabled),
    .icon-btn:hover:not(:disabled),
    .shortcut-key:hover:not(:disabled) {
      border-color: var(--accent);
      background: #ffffff;
      transform: translateY(-1px);
    }

    .small-btn:active:not(:disabled),
    .tool-btn:active:not(:disabled),
    .icon-btn:active:not(:disabled),
    .shortcut-key:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: inset 0 1px 0 rgba(23, 32, 51, 0.08);
    }

    .small-btn.primary,
    .tool-btn.active,
    .file-btn.active {
      background: var(--accent);
      border-color: var(--accent-strong);
      color: #f8fffb;
      box-shadow:
        inset 0 -2px 0 rgba(0, 0, 0, 0.18),
        0 2px 0 rgba(23, 32, 51, 0.16);
    }

    .small-btn.primary:hover:not(:disabled),
    .tool-btn.active:hover:not(:disabled),
    .file-btn.active:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent-strong);
      color: #f8fffb;
    }

    .small-btn.danger {
      background: var(--danger-weak);
      border-color: #d99aa9;
      color: var(--danger);
    }

    .topbar, .statusbar {
      background: var(--dark-panel);
      border-color: #2a3b4d;
      border-radius: 6px;
      color: #d8e6e2;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 2px 0 rgba(0, 0, 0, 0.18);
    }

    .statusbar,
    .statusbar span {
      color: #b6c8c4;
    }

    .frame-pill {
      color: #e9f3ef;
      font-weight: 700;
    }

    .frame-kind-pill {
      background: #25384a;
      color: var(--mint);
      border: 1px solid rgba(143, 216, 198, 0.28);
      border-radius: 4px;
    }

    .topbar input[type="range"] {
      accent-color: var(--mint);
    }

    .workspace {
      background:
        linear-gradient(45deg, rgba(255, 255, 255, 0.035) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.035) 25%, transparent 25%),
        var(--dark-panel-soft);
      background-size: 18px 18px;
      border: 1px solid #26384b;
      border-radius: 6px;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.035),
        0 10px 24px rgba(0, 0, 0, 0.18);
    }

    canvas {
      border: 2px solid #0f172a;
      border-radius: 3px;
      box-shadow:
        0 0 0 3px #26384b,
        0 10px 0 rgba(0, 0, 0, 0.16),
        0 18px 34px rgba(0, 0, 0, 0.26);
    }

    .panel-count, .muted, .range-hint, .source-folder-meta, .source-meta {
      color: var(--muted);
    }

    .source-format-control .source-filter {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .source-filter {
      background: #e3ebe7;
      border-color: #b9c9c2;
      border-radius: 5px;
      box-shadow: inset 0 1px 0 rgba(23, 32, 51, 0.04);
    }

    .source-filter button {
      border-radius: 3px;
      color: #5c696d;
    }

    .source-filter button.active {
      background: var(--panel-soft);
      color: var(--accent-strong);
      box-shadow:
        0 0 0 1px rgba(27, 91, 100, 0.14),
        0 2px 0 rgba(23, 32, 51, 0.08);
    }

    .source-tree-row.folder {
      background: #ebe8dc;
      border-color: #d6d0bf;
      border-radius: 5px;
    }

    .source-tree-row.file {
      border-top-color: rgba(23, 32, 51, 0.08);
      border-radius: 4px;
    }

    .source-tree-row:hover {
      background: #fffaf0;
    }

    .source-tree-row.current {
      background: #e6f4ef;
      box-shadow:
        inset 4px 0 0 var(--accent),
        inset 0 0 0 1px rgba(27, 91, 100, 0.18);
    }

    .source-folder-name::before {
      border-color: var(--accent);
      background: var(--cream);
      border-radius: 1px;
    }

    .source-file-main::before {
      width: 5px;
      border-radius: 1px;
      background: #9fb3ac;
    }

    .source-tree-row.kind-animated .source-file-main::before {
      background: var(--lavender);
    }

    .source-tree-row.kind-static .source-file-main::before {
      background: var(--mint);
    }

    .source-status,
    .badge,
    kbd {
      border-radius: 4px;
    }

    .source-status.complete {
      background: #dff3ea;
      color: #14654e;
    }

    .source-status.changed {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .source-status.warn {
      background: #f6dfd4;
      color: #a64b25;
    }

    .export-line,
    .export-progress,
    .export-summary,
    .group {
      border-top-color: rgba(23, 32, 51, 0.11);
    }

    .export-progress-bar,
    .range-track {
      background: #d7dedb;
      border-radius: 3px;
    }

    .export-progress-fill,
    .range-selection {
      background: var(--accent);
      border-radius: 3px;
    }

    .range-target-segment {
      background: rgba(188, 169, 238, 0.72);
      border-radius: 3px;
    }

    .range-handle {
      background: var(--panel-soft);
      border-color: var(--accent);
      border-radius: 4px;
      box-shadow:
        0 0 0 1px rgba(23, 32, 51, 0.18),
        0 3px 0 rgba(23, 32, 51, 0.18);
    }

    .range-handle::after {
      color: var(--accent-strong);
    }

    .range-current {
      background: var(--preview);
    }

    .range-source {
      background: var(--cream);
      box-shadow: 0 0 0 1px rgba(23, 32, 51, 0.36);
    }

    .range-frame-strip {
      background: #e2e8e4;
      border-color: #bccbc4;
      border-radius: 5px;
    }

    .range-frame {
      background: #cbd8d2;
      border-radius: 1px;
    }

    .range-frame.in-range {
      background: var(--mint);
    }

    .range-frame.will-apply::before {
      background: var(--preview);
      border-radius: 1px;
    }

    .range-frame.has-shapes::after {
      background: var(--shape);
      border-radius: 1px;
    }

    .range-metric,
    .shape-item,
    .shortcut-key,
    kbd {
      background: var(--panel-soft);
      border-color: #c6d0ca;
    }

    .range-metric {
      border-radius: 5px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .shape-item {
      border-radius: 5px;
    }

    .shape-item.active {
      border-color: var(--preview);
      background: #eee9ff;
      box-shadow: inset 4px 0 0 var(--preview);
    }

    .shape-role,
    .shortcut-key.capturing {
      color: var(--preview);
    }

    .shortcut-key.capturing {
      background: #eee9ff;
      border-color: var(--preview);
    }

    .source-actions {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .source-actions .wide,
    .source-format-control,
    #exportSelectedBtn {
      grid-column: 1 / -1;
    }

    .source-commands {
      min-width: 52px;
    }

    .range-readout {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .range-metric span {
      font-size: 10px;
    }

    .range-metric strong {
      font-size: 12px;
    }

    .shortcut-list {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .shortcut-item {
      min-height: 34px;
    }

    .shortcut-key {
      min-height: 24px;
      font-size: 11px;
    }

    .shortcut-item span:last-child {
      font-size: 11px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .export-setting-summary {
      grid-column: 1 / -1;
      min-height: 26px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      border: 1px solid #cbd8d2;
      border-radius: 5px;
      background: #eef4f1;
      color: #52615c;
      font-size: 11px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .settings-btn {
      width: 32px;
      min-height: 32px;
      border-radius: 5px;
    }

    .pixel-gear {
      position: relative;
      width: 17px;
      height: 17px;
      display: block;
      image-rendering: pixelated;
    }

    .pixel-gear::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 7px;
      width: 3px;
      height: 3px;
      background: var(--panel-soft);
      box-shadow:
        0 -7px 0 var(--accent),
        0 7px 0 var(--accent),
        -7px 0 0 var(--accent),
        7px 0 0 var(--accent),
        -5px -5px 0 var(--accent),
        5px -5px 0 var(--accent),
        -5px 5px 0 var(--accent),
        5px 5px 0 var(--accent),
        0 0 0 3px var(--accent);
    }

    .settings-overlay[hidden] {
      display: none !important;
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.42);
    }

    .settings-dialog {
      width: min(620px, calc(100vw - 48px));
      max-height: calc(100vh - 48px);
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      border: 2px solid #25384a;
      border-radius: 6px;
      background: #fbfbfa;
      box-shadow:
        0 0 0 3px rgba(143, 216, 198, 0.28),
        0 16px 0 rgba(0, 0, 0, 0.18),
        0 30px 60px rgba(0, 0, 0, 0.3);
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid rgba(23, 32, 51, 0.12);
      background: #efe8d9;
    }

    .settings-header h2 {
      margin: 0 0 3px;
      font-size: 14px;
      color: #20272d;
    }

    .settings-header span {
      color: var(--muted);
      font-size: 12px;
    }

    .settings-body {
      display: grid;
      gap: 0;
      overflow: auto;
      padding: 0 14px 14px;
    }

    .settings-section {
      display: grid;
      gap: 10px;
      padding-top: 14px;
      margin-top: 14px;
      border-top: 1px solid rgba(23, 32, 51, 0.11);
    }

    .settings-section:first-child {
      margin-top: 0;
      border-top: 0;
    }

    .settings-section-head,
    .settings-row,
    .settings-toggle {
      display: grid;
      grid-template-columns: minmax(120px, 0.42fr) minmax(0, 1fr);
      align-items: center;
      gap: 12px;
    }

    .settings-section-head {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .settings-section-head h3 {
      margin: 0;
      color: #20272d;
      font-size: 12px;
    }

    .settings-section-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .settings-row > span:first-child,
    .settings-toggle strong {
      color: #353c43;
      font-size: 12px;
      font-weight: 700;
    }

    .settings-toggle {
      cursor: pointer;
    }

    .settings-toggle span {
      display: grid;
      gap: 3px;
    }

    .settings-toggle small,
    .settings-hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .settings-toggle input {
      justify-self: end;
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
    }

    .settings-segment {
      width: 100%;
    }

    .settings-row.compact {
      grid-template-columns: minmax(120px, 0.42fr) auto;
      justify-content: space-between;
    }

    .number-control {
      display: grid;
      grid-template-columns: 92px auto;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .number-control .input {
      min-height: 30px;
      text-align: right;
    }

    .settings-hint {
      margin: 0;
      padding-left: calc(42% + 12px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .panel-count,
    .source-folder-meta:empty,
    .range-frame-strip[hidden] {
      display: none !important;
    }

    .topbar {
      display: grid;
      grid-template-columns: 34px 30px minmax(0, 1fr) 30px;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
    }

    .timeline-panel {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .timeline-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .frame-pill {
      min-width: auto;
      font-size: 12px;
      color: #c9d8d4;
    }

    .frame-kind-pill {
      min-height: 20px;
      border-radius: 4px;
      font-size: 11px;
      padding: 0 7px;
    }

    .play-btn,
    .frame-nav {
      width: 30px;
      min-height: 30px;
      border-radius: 999px;
      background: #203140;
      border-color: rgba(143, 216, 198, 0.28);
      color: #dff7ef;
      box-shadow: none;
      font-size: 17px;
      line-height: 1;
    }

    .play-btn {
      width: 34px;
      font-size: 12px;
      font-weight: 800;
    }

    .play-btn:hover:not(:disabled),
    .frame-nav:hover:not(:disabled) {
      background: #274456;
      border-color: var(--mint);
      transform: none;
    }

    .frame-timeline {
      height: 34px;
      margin: 0;
      padding: 0 7px;
    }

    .frame-timeline .range-track {
      top: 14px;
      height: 8px;
      overflow: visible;
      background: #263746;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    .range-progress {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      border-radius: 999px;
      background: rgba(143, 216, 198, 0.2);
      pointer-events: none;
    }

    .frame-timeline .range-selection,
    .frame-timeline .range-target-segment {
      top: 0;
      bottom: 0;
      min-width: 8px;
      border-radius: 999px;
      background: rgba(143, 216, 198, 0.72);
      box-shadow: 0 0 0 1px rgba(143, 216, 198, 0.18);
    }

    .frame-timeline .range-target-segment {
      background: rgba(188, 169, 238, 0.62);
    }

    .frame-timeline .range-current {
      top: 11px;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #f8fbf7;
      border: 3px solid var(--preview);
      transform: translateX(-7px);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.28);
      z-index: 5;
    }

    .frame-timeline .range-source {
      top: 25px;
      width: 5px;
      height: 7px;
      border-radius: 1px;
      background: var(--cream);
      transform: translateX(-2px);
      opacity: 0.9;
      z-index: 4;
    }

    .frame-timeline .range-handle {
      top: 4px;
      width: 22px;
      height: 16px;
      border: 0;
      background: transparent;
      box-shadow: none;
      transform: translateX(-11px);
      z-index: 6;
    }

    .frame-timeline .range-start-handle {
      top: 1px;
    }

    .frame-timeline .range-end-handle {
      top: 18px;
    }

    .frame-timeline .range-handle::after {
      content: none;
    }

    .frame-timeline .range-handle::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.28));
    }

    .frame-timeline .range-start-handle::before {
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 10px solid var(--mint);
    }

    .frame-timeline .range-end-handle::before {
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 10px solid var(--blush);
    }

    .topbar.static .frame-timeline {
      opacity: 0.45;
    }

    .right .panel-head {
      align-items: center;
    }

    .settings-btn {
      width: auto;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .settings-icon {
      position: relative;
      width: 15px;
      height: 13px;
      display: inline-block;
      background:
        linear-gradient(currentColor, currentColor) 0 1px / 15px 1.5px no-repeat,
        linear-gradient(currentColor, currentColor) 0 6px / 15px 1.5px no-repeat,
        linear-gradient(currentColor, currentColor) 0 11px / 15px 1.5px no-repeat;
      color: currentColor;
    }

    .settings-icon::before,
    .settings-icon::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: currentColor;
      top: 0;
    }

    .settings-icon::before {
      left: 3px;
      box-shadow: 7px 10px 0 currentColor;
    }

    .settings-icon::after {
      right: 2px;
      top: 5px;
    }

    .tool-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .tool-btn {
      min-height: 38px;
      padding: 0 8px;
      font-size: 14px;
      font-weight: 750;
    }

    .action-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    #clearBtn {
      display: none;
    }

    #deleteBtn {
      grid-column: 1 / -1;
    }

    .range-readout {
      display: block;
    }

    .range-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 3px 8px;
      align-items: baseline;
      padding: 8px 9px;
      border: 1px solid #c6d0ca;
      border-radius: 6px;
      background: var(--panel-soft);
    }

    .range-summary strong,
    .range-summary span,
    .range-summary small {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .range-summary strong {
      color: var(--line-strong);
      font-size: 13px;
    }

    .range-summary span {
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 750;
    }

    .range-summary small {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 11px;
    }

    .range-actions {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    #addRangeSegmentBtn,
    #setRangeStartBtn,
    #setRangeEndBtn,
    #copyShapesBtn,
    #pasteShapesBtn {
      display: none;
    }

    .range-commit-actions {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .motion-preview-card {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(23, 32, 51, 0.11);
    }

    .motion-preview-frame {
      display: grid;
      place-items: center;
      min-height: 138px;
      aspect-ratio: 16 / 10;
      border: 1px solid #c6d0ca;
      border-radius: 6px;
      background:
        linear-gradient(45deg, rgba(23, 32, 51, 0.045) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(23, 32, 51, 0.045) 25%, transparent 25%),
        #e8eee9;
      background-size: 14px 14px;
      overflow: hidden;
    }

    .motion-preview-frame img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: auto;
    }

    .source-actions {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .export-setting-summary,
    #exportSelectedBtn {
      grid-column: 1 / -1;
    }

    .topbar {
      grid-template-columns: minmax(0, 1fr);
      gap: 7px;
      padding: 9px 12px;
    }

    .play-btn {
      justify-self: center;
      width: 38px;
      min-height: 32px;
      border-radius: 999px;
    }

    .frame-nav {
      display: none !important;
    }

    .timeline-panel {
      width: 100%;
    }

    .timeline-meta {
      min-height: 20px;
    }

    .motion-preview-card {
      display: none;
    }

    #cancelBtn,
    #undoBtn,
    #saveBtn {
      display: none;
    }

    .tool-grid {
      grid-template-columns: 1fr;
      overflow: visible;
    }

    .tool-picker {
      position: relative;
      min-width: 0;
    }

    #toolModeBtn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
    }

    .tool-caret {
      position: absolute;
      right: 12px;
      width: 7px;
      height: 7px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
      opacity: 0.86;
    }

    .tool-menu[hidden] {
      display: none;
    }

    .tool-menu {
      position: absolute;
      z-index: 20;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      display: grid;
      gap: 4px;
      padding: 5px;
      border: 1px solid #b7c8c0;
      border-radius: 6px;
      background: var(--panel-soft);
      box-shadow: 0 10px 24px rgba(23, 32, 51, 0.16);
    }

    .tool-menu button {
      min-height: 30px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .tool-menu button:hover {
      background: var(--accent-weak);
      color: var(--accent-strong);
    }

    .action-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #completeBtn {
      grid-column: auto;
    }

    .range-panel {
      gap: 7px;
    }

    .range-summary {
      padding: 7px 8px;
      border-radius: 5px;
    }

    .range-actions {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #setRangeSourceBtn {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="panel-head app-head">
        <div class="app-title">
          <img class="app-logo" src="/assets/motion-mosaic-icon.png" alt="" aria-hidden="true">
          <div>
            <h1>Motion Mosaic</h1>
            <span>素材</span>
          </div>
        </div>
        <span id="directoryMeta" class="panel-count"></span>
      </div>
      <div class="source-field">
        <label for="sourceDirInput">图片目录</label>
        <div class="path-control">
          <input id="sourceDirInput" class="input" type="text" spellcheck="false">
          <button id="sourceBrowseBtn" class="small-btn" title="在电脑里选择图片目录">选择</button>
        </div>
      </div>
      <div class="source-field">
        <label for="outputDirInput">导出目录</label>
        <div class="path-control">
          <input id="outputDirInput" class="input" type="text" spellcheck="false">
          <button id="outputBrowseBtn" class="small-btn" title="在电脑里选择导出目录">选择</button>
        </div>
      </div>
      <div class="source-actions">
        <button id="refreshBtn" class="small-btn">刷新列表</button>
        <button id="selectAllSourcesBtn" class="small-btn">勾选全部</button>
        <div id="exportSettingSummary" class="export-setting-summary">AVIF · 自动压缩 1 MB</div>
        <button id="exportSelectedBtn" class="small-btn primary wide" title="保存标注；动图按所选格式导出，静态图导出 WebP">导出已完成</button>
      </div>
      <div id="exportStatus" class="export-status"></div>

      <div class="group">
        <div class="section-head">
          <h2>文件</h2>
        </div>
        <div class="source-filter-bar">
          <div id="sourceFilter" class="source-filter" role="group" aria-label="完成筛选">
            <button type="button" class="active" data-filter="all">全部</button>
            <button type="button" data-filter="complete">已完成</button>
            <button type="button" data-filter="incomplete">未完成</button>
          </div>
          <div id="sourceKindFilter" class="source-filter" role="group" aria-label="类型筛选">
            <button type="button" class="active" data-kind="all">全部</button>
            <button type="button" data-kind="animated">动图</button>
            <button type="button" data-kind="static">静图</button>
          </div>
        </div>
        <div id="sourceFileList" class="source-list"></div>
      </div>

      <div id="fileList" hidden></div>
    </aside>

    <main>
      <div id="topbar" class="topbar">
        <button id="playBtn" class="icon-btn play-btn" title="播放/暂停（空格）" aria-label="播放/暂停">▶</button>
        <button id="prevBtn" class="icon-btn frame-nav" title="上一帧" aria-label="上一帧">‹</button>
        <div class="timeline-panel">
          <div class="timeline-meta">
            <span id="frameKindText" class="frame-kind-pill">图片</span>
            <span id="frameText" class="frame-pill">0 / 0</span>
          </div>
          <div id="rangeTimeline" class="range-timeline frame-timeline">
            <div class="range-track">
              <div id="rangeProgress" class="range-progress"></div>
              <div id="rangeSelection" class="range-selection"></div>
            </div>
            <div id="rangeSource" class="range-source"></div>
            <div id="rangeCurrent" class="range-current"></div>
            <button id="rangeStartHandle" class="range-handle range-start-handle" type="button" aria-label="范围起点"></button>
            <button id="rangeEndHandle" class="range-handle range-end-handle" type="button" aria-label="范围终点"></button>
          </div>
        </div>
        <button id="nextBtn" class="icon-btn frame-nav" title="下一帧" aria-label="下一帧">›</button>
        <input id="frameSlider" class="sr-only" type="range" min="0" value="0" tabindex="-1" aria-hidden="true">
      </div>

      <div class="workspace">
        <canvas id="canvas" width="1" height="1"></canvas>
      </div>

      <div class="statusbar">
        <span id="status">加载中</span>
        <span id="saveState">未保存</span>
      </div>
    </main>

    <section class="right">
      <div class="panel-head">
        <h2>编辑</h2>
        <button id="settingsBtn" class="icon-btn settings-btn" type="button" aria-label="设置" title="设置" aria-expanded="false">
          <span class="settings-icon" aria-hidden="true"></span>
          <span>设置</span>
        </button>
      </div>
      <div class="tool-grid">
        <div class="tool-picker">
          <button id="toolModeBtn" class="tool-btn active" type="button" aria-haspopup="true" aria-expanded="false">
            <span id="toolModeLabel">矩形</span>
            <span class="tool-caret" aria-hidden="true"></span>
          </button>
          <div id="toolMenu" class="tool-menu" hidden>
            <button type="button" data-tool="rect">矩形</button>
            <button type="button" data-tool="polygon">多边形</button>
          </div>
        </div>
      </div>

      <div class="action-grid">
        <button id="cancelBtn" class="small-btn">取消</button>
        <button id="undoBtn" class="small-btn">撤销</button>
        <button id="completeBtn" class="small-btn">无需打码</button>
        <button id="saveBtn" class="small-btn primary" title="已自动保存；需要时可手动立即保存">立即保存</button>
        <button id="deleteBtn" class="small-btn danger">删除选中</button>
        <button id="clearBtn" class="small-btn danger">清空本帧</button>
      </div>

      <div class="group">
        <div class="section-head">
          <h2>范围</h2>
          <span id="rangeHint" class="range-hint">先画区域</span>
        </div>
        <div class="range-panel">
          <div class="range-readout">
            <div class="range-summary">
              <strong id="rangeSpanText">1-1</strong>
              <span id="rangeCountText">1 帧</span>
              <small id="rangeSourceText">源 1 · 0 区域</small>
            </div>
          </div>
          <div id="rangeFrameStrip" class="range-frame-strip" hidden></div>
          <div class="range-actions">
            <button id="setRangeSourceBtn" class="small-btn">用本帧</button>
            <button id="addRangeSegmentBtn" class="small-btn">加入这段</button>
            <button id="setRangeStartBtn" class="small-btn">设为开始</button>
            <button id="setRangeEndBtn" class="small-btn">设为结束</button>
            <button id="setWholeRangeBtn" class="small-btn">全片</button>
            <button id="clearRangeSegmentsBtn" class="small-btn">清除</button>
          </div>
          <div class="range-commit-actions">
            <button id="applyRangeBtn" class="small-btn primary">应用</button>
            <button id="removeRangeBtn" class="small-btn danger">移除</button>
            <button id="copyShapesBtn" class="small-btn">复制区域</button>
            <button id="pasteShapesBtn" class="small-btn">粘贴到本帧</button>
          </div>
        </div>
      </div>

      <div class="motion-preview-card">
        <div class="section-head">
          <h2>预览</h2>
          <span id="previewHint" class="range-hint">静态</span>
        </div>
        <div class="motion-preview-frame">
          <img id="motionPreview" alt="">
        </div>
      </div>

      <div class="group">
        <div class="section-head">
          <h2>本帧区域</h2>
        </div>
        <div id="shapeList" class="shape-list"></div>
      </div>
    </section>
  </div>

  <div id="settingsOverlay" class="settings-overlay" hidden>
    <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="settings-header">
        <div>
          <h2 id="settingsTitle">设置</h2>
          <span>导出和快捷键</span>
        </div>
        <button id="settingsCloseBtn" class="icon-btn" type="button" aria-label="关闭设置">×</button>
      </header>
      <div class="settings-body">
        <section class="settings-section">
          <div class="settings-section-head">
            <h3>导出</h3>
            <span id="settingsExportSummary">AVIF · 自动压缩 1 MB</span>
          </div>
          <div class="settings-row">
            <span>动图格式</span>
            <div id="animatedFormatControl" class="source-filter settings-segment" role="group" aria-label="动图导出格式">
              <button type="button" class="active" data-format="avif">AVIF</button>
              <button type="button" data-format="webp">WebP</button>
              <button type="button" data-format="webm">WebM</button>
            </div>
          </div>
          <label class="settings-toggle" for="autoCompressToggle">
            <span>
              <strong>自动压缩</strong>
              <small>按目标体积迭代压缩导出文件</small>
            </span>
            <input id="autoCompressToggle" type="checkbox" checked>
          </label>
          <label class="settings-row compact" for="maxOutputMbInput">
            <span>最大体积</span>
            <span class="number-control">
              <input id="maxOutputMbInput" class="input" type="number" min="0.1" max="100" step="0.1" value="1">
              <span>MB</span>
            </span>
          </label>
          <p id="compressHint" class="settings-hint">默认自动压缩到 1 MB 以内。</p>
        </section>

        <section class="settings-section">
          <div class="settings-section-head">
            <h3>快捷键</h3>
            <button id="resetShortcutsBtn" class="small-btn" type="button">重置</button>
          </div>
          <div id="shortcutList" class="shortcut-list"></div>
        </section>
      </div>
    </section>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const sourceDirInput = document.getElementById('sourceDirInput');
    const outputDirInput = document.getElementById('outputDirInput');
    const sourceFileList = document.getElementById('sourceFileList');
    const sourceFilter = document.getElementById('sourceFilter');
    const sourceKindFilter = document.getElementById('sourceKindFilter');
    const animatedFormatControl = document.getElementById('animatedFormatControl');
    const exportSettingSummary = document.getElementById('exportSettingSummary');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsCloseBtn = document.getElementById('settingsCloseBtn');
    const settingsExportSummary = document.getElementById('settingsExportSummary');
    const autoCompressToggle = document.getElementById('autoCompressToggle');
    const maxOutputMbInput = document.getElementById('maxOutputMbInput');

    const shapeList = document.getElementById('shapeList');

    const rangeProgress = document.getElementById('rangeProgress');

    const rangeStartHandle = document.getElementById('rangeStartHandle');
    const rangeEndHandle = document.getElementById('rangeEndHandle');
    const rangeFrameStrip = document.getElementById('rangeFrameStrip');
    const rangeSourceText = document.getElementById('rangeSourceText');
    const rangeSpanText = document.getElementById('rangeSpanText');
    const rangeCountText = document.getElementById('rangeCountText');
    const rangeHint = document.getElementById('rangeHint');
    const undoBtn = document.getElementById('undoBtn');
    const completeBtn = document.getElementById('completeBtn');
    const applyRangeBtn = document.getElementById('applyRangeBtn');
    const addRangeSegmentBtn = document.getElementById('addRangeSegmentBtn');
    const clearRangeSegmentsBtn = document.getElementById('clearRangeSegmentsBtn');
    const removeRangeBtn = document.getElementById('removeRangeBtn');

    const toolMenu = document.getElementById('toolMenu');
    const HISTORY_LIMIT = 40;
    const AUTO_SAVE_DELAY = 300;
    const SHORTCUT_STORAGE_KEY = 'motionMosaicShortcuts.v1';
    const LEGACY_SHORTCUT_STORAGE_KEY = 'remaskShortcuts.v1';
    const EXPORT_SETTINGS_STORAGE_KEY = 'motionMosaicExportSettings.v1';
    const DEFAULT_EXPORT_MAX_MB = 1;

    const ANIMATED_FORMATS = new Set(['avif', 'webp', 'webm']);
    const SHORTCUT_ITEMS = [
      ['prevFrame', '上一帧'],
      ['nextFrame', '下一帧'],
      ['prevFile', '上一张'],
      ['nextFile', '下一张'],
      ['toggleComplete', '完成并下一张'],
      ['rangeStart', '设开始'],
      ['rangeEnd', '设结束'],
      ['applyRange', '应用当前区域'],
      ['undo', '撤销'],
      ['cancel', '取消绘制'],
      ['delete', '删除选中'],
      ['save', '保存']
    ];
    const DEFAULT_SHORTCUTS = {

      autoImportFailures: new Set()
    };
    const RECT_MIN_SIZE = 4;

    function uid() {
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function loadShortcuts() {
      try {
        const stored = JSON.parse(
          localStorage.getItem(SHORTCUT_STORAGE_KEY) ||
          localStorage.getItem(LEGACY_SHORTCUT_STORAGE_KEY) ||
          '{}'
        );
        state.shortcuts = { ...DEFAULT_SHORTCUTS };
        for (const [action] of SHORTCUT_ITEMS) {
          if (typeof stored[action] === 'string') state.shortcuts[action] = stored[action];
        }
      } catch {
        state.shortcuts = { ...DEFAULT_SHORTCUTS };
      }
    }

    function saveShortcuts() {
      try {
        localStorage.setItem(SHORTCUT_STORAGE_KEY, JSON.stringify(state.shortcuts));
      } catch {
        // Shortcut customization is local convenience; annotation saving is unaffected.
      }
    }

    function normalizeExportMaxMB(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number <= 0) return DEFAULT_EXPORT_MAX_MB;
      return Math.min(MAX_EXPORT_MAX_MB, Math.max(MIN_EXPORT_MAX_MB, Math.round(number * 10) / 10));
    }

    function formatExportMB(value) {
      const normalized = normalizeExportMaxMB(value);
      return Number.isInteger(normalized) ? String(normalized) : normalized.toFixed(1);
    }

    function exportTargetBytes() {
      if (!state.exportAutoCompress) return null;
      return Math.round(normalizeExportMaxMB(state.exportMaxMB) * 1024 * 1024);
    }

    function exportSettingsLabel() {
      const format = state.animatedFormat.toUpperCase();
      return state.exportAutoCompress
        ? `${format} · 自动压缩 ${formatExportMB(state.exportMaxMB)} MB`
        : `${format} · 不限制体积`;
    }

    function loadExportSettings() {
      try {
        const stored = JSON.parse(localStorage.getItem(EXPORT_SETTINGS_STORAGE_KEY) || '{}');
        if (ANIMATED_FORMATS.has(stored.animatedFormat)) {
          state.animatedFormat = stored.animatedFormat;
        }
        if (typeof stored.autoCompress === 'boolean') {
          state.exportAutoCompress = stored.autoCompress;
        }
        if (stored.maxMB !== undefined) {
          state.exportMaxMB = normalizeExportMaxMB(stored.maxMB);
        }
      } catch {
        state.animatedFormat = 'avif';
        state.exportAutoCompress = true;
        state.exportMaxMB = DEFAULT_EXPORT_MAX_MB;
      }
    }

    function saveExportSettings() {
      try {
        localStorage.setItem(EXPORT_SETTINGS_STORAGE_KEY, JSON.stringify({
          animatedFormat: state.animatedFormat,
          autoCompress: state.exportAutoCompress,
          maxMB: normalizeExportMaxMB(state.exportMaxMB)
        }));
      } catch {
        // Export preferences are local convenience; rendering still uses safe defaults.
      }
    }

    function renderExportSettings() {
      const label = exportSettingsLabel();
      exportSettingSummary.textContent = label;
      settingsExportSummary.textContent = label;
      autoCompressToggle.checked = state.exportAutoCompress;
      maxOutputMbInput.disabled = !state.exportAutoCompress;
      maxOutputMbInput.value = formatExportMB(state.exportMaxMB);
      compressHint.textContent = state.exportAutoCompress
        ? `导出时会尝试压到 ${formatExportMB(state.exportMaxMB)} MB 以内；AVIF 较慢但默认保留。`
        : '关闭后不按目标体积迭代压缩，只按所选格式正常导出。';
      renderSourceFilter();
    }

    function openSettings() {
      renderExportSettings();
      renderShortcutList();
      settingsOverlay.hidden = false;
      settingsBtn.setAttribute('aria-expanded', 'true');
      settingsCloseBtn.focus();
    }

    function closeSettings() {
      state.capturingShortcut = null;
      settingsOverlay.hidden = true;
      settingsBtn.setAttribute('aria-expanded', 'false');
      renderShortcutList();
      settingsBtn.focus();
    }

    function formatShortcut(combo) {
      if (!combo) return '未设';
      return combo
        .replace('ArrowLeft', '←')
        .replace('ArrowRight', '→')
        .replace('ArrowUp', '↑')
        .replace('ArrowDown', '↓')
        .replace('Escape', 'Esc')
        .replace('Delete', 'Del')
        .replace('Backspace', 'Back')
        .replace(' ', 'Space');
    }

    function shortcutForEvent(evt) {
      if (['Control', 'Shift', 'Alt', 'Meta'].includes(evt.key)) return '';
      const parts = [];
      if (evt.ctrlKey || evt.metaKey) parts.push('Ctrl');
      if (evt.altKey) parts.push('Alt');
      if (evt.shiftKey) parts.push('Shift');
      let key = evt.key;
      if (key.length === 1) key = key.toUpperCase();
      if (key === ' ') key = 'Space';
      parts.push(key);
      return parts.join('+');
    }

    function shortcutMatches(evt, action) {
      return Boolean(state.shortcuts[action]) && shortcutForEvent(evt) === state.shortcuts[action];
    }

    function hasTextSelection() {
      const selection = window.getSelection();
      return Boolean(selection && !selection.isCollapsed && selection.toString().trim());
    }

    function setShortcut(action, combo) {
      for (const [otherAction] of SHORTCUT_ITEMS) {
        if (otherAction !== action && state.shortcuts[otherAction] === combo) {
          state.shortcuts[otherAction] = '';
        }
      }
      state.shortcuts[action] = combo;
      state.capturingShortcut = null;
      saveShortcuts();
      renderShortcutList();
      const label = SHORTCUT_ITEMS.find(([key]) => key === action)?.[1] || action;
      statusEl.textContent = `${label} 快捷键：${formatShortcut(combo)}`;
    }

    function renderShortcutList() {
      shortcutList.innerHTML = '';
      for (const [action, label] of SHORTCUT_ITEMS) {
        const item = document.createElement('div');
        item.className = 'shortcut-item';
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `shortcut-key${state.capturingShortcut === action ? ' capturing' : ''}`;
        button.textContent = state.capturingShortcut === action ? '按键...' : formatShortcut(state.shortcuts[action]);
        button.title = '点击后按新的快捷键';
        button.addEventListener('click', () => {
          state.capturingShortcut = action;
          renderShortcutList();
          statusEl.textContent = `设置 ${label} 快捷键`;
        });
        const text = document.createElement('span');
        text.textContent = label;
        item.appendChild(button);
        item.appendChild(text);
        shortcutList.appendChild(item);
      }
    }

    function formatBytes(bytes) {
      const units = ['B', 'KB', 'MB', 'GB'];
      let value = Number(bytes) || 0;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return `${value.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
    }

    function sourceKindLabel(kind) {
      if (kind === 'animated') return '动图';
      if (kind === 'static') return '静态图';
      return '图片';
    }

    function currentFile() {
      return state.files[state.activeFile] || null;
    }

    function isSingleFrame(file = currentFile()) {
      return !file || file.frameCount <= 1;
    }

    function frameDuration(file = currentFile(), frame = state.frame) {
      const durations = Array.isArray(file?.durations) ? file.durations : [];
      const duration = Number(durations[clampFrameIndex(frame)]);
      return Number.isFinite(duration) ? Math.max(20, duration) : 100;
    }

    function updatePlayControls() {
      const file = currentFile();
      const disabled = !file || isSingleFrame(file) || state.busy;
      playBtn.disabled = disabled;
      playBtn.textContent = state.playing ? 'Ⅱ' : '▶';
      playBtn.setAttribute('aria-label', state.playing ? '暂停' : '播放');
      playBtn.title = state.playing ? '暂停（空格）' : '播放（空格）';
      topbar.classList.toggle('playing', state.playing);
      previewHint.textContent = !file || isSingleFrame(file) ? '静态' : (state.playing ? '播放中' : '');
    }

    function stopPlayback() {
      if (state.playTimer) {
        clearTimeout(state.playTimer);
        state.playTimer = null;
      }
      state.playing = false;
      updatePlayControls();
    }

    function schedulePlaybackTick() {
      if (!state.playing) return;
      const file = currentFile();
      if (!file || isSingleFrame(file)) {
        stopPlayback();
        return;
      }
      state.playTimer = setTimeout(() => {
        if (!state.playing) return;
        setFrame((state.frame + 1) % file.frameCount, { fromPlayback: true });
        schedulePlaybackTick();
      }, frameDuration(file, state.frame));
    }

    function startPlayback() {
      const file = currentFile();
      if (!file || isSingleFrame(file) || state.busy) return;
      state.playing = true;
      updatePlayControls();
      schedulePlaybackTick();
    }

    function togglePlayback() {
      if (state.playing) stopPlayback();
      else startPlayback();
    }

    function fileKindText(file = currentFile()) {
      if (!file) return '图片';
      return isSingleFrame(file) ? '静态图' : '动图';
    }

    function syncFrameControls() {
      const file = currentFile();
      const disabled = !file || isSingleFrame(file) || state.busy;
      frameSlider.disabled = disabled;
      prevBtn.disabled = disabled;
      nextBtn.disabled = disabled;
      topbar.classList.toggle('static', !file || isSingleFrame(file));
      frameKindText.textContent = fileKindText(file);
      if (disabled && state.playing) stopPlayback();
      else updatePlayControls();
    }

    function fileIndexForSource(sourceId) {
      return state.files.findIndex(file => file.id === sourceId);
    }

    function fileStore(fileId = currentFile()?.id) {
      if (!fileId) return { frames: {} };
      if (!state.annotations.files[fileId]) {
        state.annotations.files[fileId] = { frames: {} };
      }
      return state.annotations.files[fileId];
    }

    function frameShapes(fileId = currentFile()?.id, frame = state.frame) {
      if (!fileId) return [];
      const store = fileStore(fileId);
      const key = String(frame);
      if (!store.frames[key]) store.frames[key] = [];
      return store.frames[key];
    }

    function readFrameShapes(fileId = currentFile()?.id, frame = state.frame) {
      if (!fileId) return [];
      const shapes = state.annotations.files?.[fileId]?.frames?.[String(frame)];
      return Array.isArray(shapes) ? shapes : [];
    }

    function cloneAnnotations(data = state.annotations) {
      return JSON.parse(JSON.stringify(data || { version: 1, files: {} }));
    }

    function annotationsSnapshot(data = state.annotations) {
      return JSON.stringify(data || { version: 1, files: {} });
    }

    function updateSaveIndicator() {
      if (state.saving) saveState.textContent = '保存中';
      else if (state.saveError) saveState.textContent = '保存失败';
      else if (state.dirty) saveState.textContent = '待自动保存';
      else saveState.textContent = '已保存';
    }

    function clearPendingAutoSave() {
      if (!state.saveTimer) return;
      clearTimeout(state.saveTimer);
      state.saveTimer = null;
    }

    function scheduleAutoSave(delay = AUTO_SAVE_DELAY) {
      if (!state.dirty || state.saving) return;
      clearPendingAutoSave();
      state.saveTimer = setTimeout(() => {
        state.saveTimer = null;
        saveAnnotations({ quiet: true, auto: true }).catch(error => {
          console.error(error);
          statusEl.textContent = `自动保存失败：${error.message}`;
        });
      }, delay);
    }

    function markDirtyFromSnapshot(options = {}) {
      setDirty(annotationsSnapshot() !== state.savedSnapshot, options);
    }

    function pushHistory(label = '') {
      state.history.push({
        annotations: cloneAnnotations(),
        fileId: currentFile()?.id || '',
        frame: state.frame,
        selectedId: state.selectedId,
        selectedIds: selectedIds(),
        selectionAnchorId: state.selectionAnchorId,
        rangeSource: state.rangeSource,
        rangeSourceLocked: state.rangeSourceLocked,
        rangeShapeIds: [...state.rangeShapeIds],
        rangeStart: state.rangeStart,
        rangeEnd: state.rangeEnd,
        rangeSegments: state.rangeSegments.map(segment => ({ ...segment })),
        label
      });
      if (state.history.length > HISTORY_LIMIT) state.history.shift();
      renderActionControls();
    }

    function countFileShapes(fileId) {
      const frames = state.annotations.files?.[fileId]?.frames || {};
      return Object.values(frames).reduce((total, shapes) => total + (Array.isArray(shapes) ? shapes.length : 0), 0);
    }

    function countAnnotatedFrames(fileId) {
      const frames = state.annotations.files?.[fileId]?.frames || {};
      return Object.values(frames).filter(shapes => Array.isArray(shapes) && shapes.length).length;
    }

    function isFileComplete(fileId) {
      return Boolean(state.annotations.files?.[fileId]?.complete);
    }

    function fileCompletionLabel(fileId) {
      if (!isFileComplete(fileId)) return '';
      return countFileShapes(fileId) ? '已完成' : '无需打码';
    }

    function clearFileCompletion(fileId = currentFile()?.id) {
      if (!fileId) return;
      const store = fileStore(fileId);
      if (!store.complete) return;
      delete store.complete;
      delete store.completeReason;
      delete store.completedAt;
    }

    function markCurrentFileEdited() {
      clearFileCompletion();
    }

    function renderActionControls() {
      if (undoBtn) undoBtn.disabled = state.busy || !state.history.length;
      if (!completeBtn) return;
      const file = currentFile();
      completeBtn.disabled = state.busy || !file;
      if (!file) {
        completeBtn.textContent = '无需打码';
        completeBtn.title = '';
        return;
      }
      if (isFileComplete(file.id)) {
        completeBtn.textContent = '取消完成';
        completeBtn.title = '快捷键 F：把当前文件恢复为未完成';
      } else if (countFileShapes(file.id)) {
        completeBtn.textContent = '标为完成';
        completeBtn.title = '快捷键 F：标为完成并跳到下一张';
      } else {
        completeBtn.textContent = '无需打码';
        completeBtn.title = '快捷键 F：标为完成并跳到下一张';
      }
    }

    function undoLast() {
      const entry = state.history.pop();
      if (!entry) {
        statusEl.textContent = '没有可撤销的操作';
        renderActionControls();
        return;
      }
      state.annotations = cloneAnnotations(entry.annotations);
      const nextIndex = state.files.findIndex(file => file.id === entry.fileId);
      if (nextIndex >= 0) state.activeFile = nextIndex;
      state.frame = entry.frame || 0;
      state.selectedId = entry.selectedId || null;
      state.selectedIds = entry.selectedIds?.length ? [...entry.selectedIds] : (entry.selectedId ? [entry.selectedId] : []);
      state.selectionAnchorId = entry.selectionAnchorId || state.selectedId || null;
      syncPrimarySelection();
      state.rangeSource = entry.rangeSource || 0;
      state.rangeSourceLocked = Boolean(entry.rangeSourceLocked);
      state.rangeShapeIds = [...(entry.rangeShapeIds || [])];
      state.rangeStart = entry.rangeStart || 0;
      state.rangeEnd = entry.rangeEnd || 0;
      state.rangeSegments = (entry.rangeSegments || []).map(segment => ({ ...segment }));
      resetCanvasInteraction();
      markDirtyFromSnapshot();
      renderDirectoryMeta();
      renderFileList();
      renderActionControls();
      const file = currentFile();
      if (file) {
        state.frame = Math.max(0, Math.min(file.frameCount - 1, state.frame));
        frameSlider.max = file.frameCount - 1;
        frameSlider.value = state.frame;
        syncFrameControls();
        renderRangeControls();
        loadFrameImage();
      } else {
        clearCanvas('没有帧');
      }
      statusEl.textContent = entry.label ? `已撤销：${entry.label}` : '已撤销';
    }

    function setCurrentFileComplete(complete) {
      const file = currentFile();
      if (!file) return;
      pushHistory(complete ? '标记完成' : '取消完成');
      const store = fileStore(file.id);
      if (complete) {
        store.complete = true;
        store.completeReason = countFileShapes(file.id) ? 'reviewed' : 'no_censor';
        store.completedAt = new Date().toISOString();
      } else {
        delete store.complete;
        delete store.completeReason;
        delete store.completedAt;
      }
      setDirty(true);
      renderDirectoryMeta();
      renderFileList();
      renderActionControls();
      statusEl.textContent = complete
        ? `${file.name} · ${fileCompletionLabel(file.id)}`
        : `${file.name} · 已取消完成`;
    }

    function toggleCurrentFileComplete() {
      const file = currentFile();
      if (!file) return;
      setCurrentFileComplete(!isFileComplete(file.id));
    }

    function completeCurrentFileAndAdvance() {
      const file = currentFile();
      if (!file) return;
      if (isFileComplete(file.id)) {
        setCurrentFileComplete(false);
        return;
      }
      setCurrentFileComplete(true);
      if (state.activeFile < state.files.length - 1) {
        selectFile(state.activeFile + 1, { scrollSource: true });
      }
    }

    function isRangeShape(shape) {
      if (!shape || !Array.isArray(shape.points)) return false;
      if (shape.type === 'rect') return shape.points.length >= 2;
      if (shape.type === 'polygon') return shape.points.length >= 3;
      return false;
    }

    function shapeLabel(shape) {
      if (shape?.type === 'rect') return '矩形';
      if (shape?.type === 'polygon') return '多边形';
      return '旧区域';
    }

    function shapeTrackId(shape) {
      return shape?.trackId || shape?.id || '';
    }

    function ensureShapeTrack(shape) {
      if (!shape.trackId) shape.trackId = shape.id || uid();
      return shape.trackId;
    }

    function shapeMatchesRangeSelection(shape, wanted) {
      return wanted.has(shape.id) || wanted.has(shapeTrackId(shape));
    }

    function selectedIds() {
      return [...new Set([...(state.selectedIds || []), state.selectedId].filter(Boolean))];
    }

    function syncPrimarySelection() {
      state.selectedIds = [...new Set(state.selectedIds || [])];
      state.selectedId = state.selectedIds[state.selectedIds.length - 1] || null;
      if (state.selectionAnchorId && !state.selectedIds.includes(state.selectionAnchorId)) {
        state.selectionAnchorId = state.selectedId;
      }
    }

    function selectedFrameShapes() {
      const wanted = new Set(selectedIds());
      if (!wanted.size) return [];
      return readFrameShapes().filter(shape => wanted.has(shape.id));
    }

    function isShapeSelected(shape) {
      return selectedIds().includes(shape.id);
    }

    function clearSelection() {
      state.selectedId = null;
      state.selectedIds = [];
      state.selectionAnchorId = null;
      state.rangeShapeIds = [];
    }

    function captureRangeShapes(frame = state.frame) {
      const file = currentFile();
      if (!file) return [];
      const shapes = readFrameShapes(file.id, frame).filter(isRangeShape);
      const wanted = new Set(selectedIds());
      const selected = wanted.size ? shapes.filter(shape => wanted.has(shape.id)) : [];
      const nextShapes = selected.length ? selected : shapes;
      state.rangeShapeIds = nextShapes.map(ensureShapeTrack);
      return nextShapes;
    }

    function rangeForShapes(shapes) {
