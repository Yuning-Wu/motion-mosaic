        const [a, b] = shape.points;
        if (a.x === active.fixed.x && a.y === active.fixed.y && b.x === nextPoint.x && b.y === nextPoint.y) return;
      } else {
        const current = shape.points[active.pointIndex];
        if (!current || (current.x === nextPoint.x && current.y === nextPoint.y)) return;
      }
      if (!active.changed) {
        pushHistory(shape.type === 'polygon' ? '调整多边形' : '调整矩形');
        markCurrentFileEdited();
        active.changed = true;
      }
      if (active.mode === 'rect-corner') {
        shape.points = [{ ...active.fixed }, nextPoint];
      } else {
        shape.points[active.pointIndex] = nextPoint;
      }
      draw();
    }

    function finishResize(evt) {
      if (!state.resizing) return;
      const changed = state.resizing.changed;
      state.resizing = null;
      releaseDrawingPointer(evt);
      canvas.style.cursor = '';
      if (changed) {
        setDirty(true);
        renderShapeList();
        renderRangeControls();
      }
      draw();
    }

    canvas.addEventListener('pointerdown', evt => {
      if (!currentFile()) return;
      if (evt.button !== 0) return;
      const p = canvasPoint(evt);
      const handle = pickResizeHandleAt(p);
      if (handle) {
        beginResize(handle, evt);
        evt.preventDefault();
        return;
      }
      if (!state.drawing && evt.altKey) {
        const edge = pickPolygonEdgeAt(p);
        if (edge && insertPolygonPoint(edge, p)) {
          evt.preventDefault();
          return;
        }
      }
      if (state.activeTool === 'polygon') {
        if (evt.detail > 1) {
          evt.preventDefault();
          return;
        }
        if (!state.drawing || state.drawing.type !== 'polygon') {
          const hit = pickShapeAt(p);
          if (hit) {
            selectRangeShape(hit, {
              additive: evt.ctrlKey || evt.metaKey,
              range: evt.shiftKey
            });
            renderShapeList();
            renderRangeControls();
            draw();
          } else {
            startPolygonAt(p);
          }
        } else {
          addPolygonPoint(p);
        }
        evt.preventDefault();
        return;
      }
      const hit = pickShapeAt(p);
      if (hit) {
        state.pendingSelection = {
          start: p,
          hitId: hit.id,
          additive: evt.ctrlKey || evt.metaKey,
          range: evt.shiftKey
        };
        state.drawingPointerId = evt.pointerId;
        canvas.setPointerCapture(evt.pointerId);
        evt.preventDefault();
        return;
      }
      startDrawingAt(p, evt.pointerId);
      evt.preventDefault();
    });

    canvas.addEventListener('pointermove', evt => {
      const p = canvasPoint(evt);
      if (state.resizing) {
        updateResize(p);
        return;
      }
      if (state.pendingSelection) {
        if (dragStarted(state.pendingSelection.start, p)) {
          startDrawingAt(state.pendingSelection.start, evt.pointerId);
          state.drawing.points[1] = p;
          draw();
        }
        return;
      }
      if (!state.drawing) {
        const handle = pickResizeHandleAt(p);
        const edge = evt.altKey ? pickPolygonEdgeAt(p) : null;
        canvas.style.cursor = handle
          ? (handle.handle || handle.corner).cursor
          : (edge ? 'copy' : '');
        return;
      }
      if (state.drawing.type === 'polygon') {
        state.drawing.previewPoint = p;
        canvas.style.cursor = polygonCloseHit(p) ? 'pointer' : 'crosshair';
        draw();
        return;
      }
      state.drawing.points[1] = p;
      draw();
    });

    canvas.addEventListener('pointerup', evt => {
      if (state.resizing) {
        finishResize(evt);
        return;
      }
      if (state.pendingSelection) {
        const pending = state.pendingSelection;
        const hit = readFrameShapes().find(shape => shape.id === pending.hitId);
        state.pendingSelection = null;
        releaseDrawingPointer(evt);
        if (hit) {
          selectRangeShape(hit, {
            additive: pending.additive,
            range: pending.range
          });
          renderShapeList();
          renderRangeControls();
          draw();
        }
        return;
      }
      if (state.drawing?.type === 'polygon') {
        releaseDrawingPointer(evt);
        return;
      }
      finishDrawing(evt);
    });
    canvas.addEventListener('dblclick', evt => {
      if (state.drawing?.type !== 'polygon') return;
      evt.preventDefault();
      finishPolygonDrawing(evt);
    });
    canvas.addEventListener('pointercancel', evt => {
      const resizeChanged = state.resizing?.changed;
      resetCanvasInteraction();
      releaseDrawingPointer(evt);
      if (resizeChanged) setDirty(true);
      draw();
    });

    toolModeBtn.addEventListener('click', evt => {
      evt.preventDefault();
      evt.stopPropagation();
      toolMenu.hidden = !toolMenu.hidden;
      toolModeBtn.setAttribute('aria-expanded', String(!toolMenu.hidden));
    });
    toolMenu.addEventListener('click', evt => {
      const button = evt.target.closest('button[data-tool]');
      if (!button) return;
      evt.preventDefault();
      evt.stopPropagation();
      setTool(button.dataset.tool || 'rect');
    });
    document.addEventListener('click', evt => {
      if (evt.target instanceof Element && evt.target.closest('.tool-picker')) return;
      toolMenu.hidden = true;
      toolModeBtn.setAttribute('aria-expanded', 'false');
    });
    settingsBtn.addEventListener('click', openSettings);
    settingsCloseBtn.addEventListener('click', closeSettings);
    settingsOverlay.addEventListener('click', evt => {
      if (evt.target === settingsOverlay) closeSettings();
    });
    resetShortcutsBtn.addEventListener('click', evt => {
      evt.preventDefault();
      evt.stopPropagation();
      state.shortcuts = { ...DEFAULT_SHORTCUTS };
      state.capturingShortcut = null;
      saveShortcuts();
      renderShortcutList();
      statusEl.textContent = '快捷键已重置';
    });
    document.getElementById('prevBtn').addEventListener('click', () => setFrame(state.frame - 1));
    document.getElementById('nextBtn').addEventListener('click', () => setFrame(state.frame + 1));
    playBtn.addEventListener('click', togglePlayback);
    document.getElementById('cancelBtn').addEventListener('click', () => {
      resetCanvasInteraction();
      releaseDrawingPointer();
      draw();
    });
    document.getElementById('undoBtn').addEventListener('click', undoLast);
    document.getElementById('completeBtn').addEventListener('click', toggleCurrentFileComplete);
    document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (!currentFile()) return;
      pushHistory('清空本帧');
      markCurrentFileEdited();
      fileStore().frames[String(state.frame)] = [];
      state.selectedId = null;
      state.selectedIds = [];
      state.selectionAnchorId = null;
      state.rangeShapeIds = [];
      setDirty(true);
      renderShapeList();
      draw();
    });
    rangeTimeline.addEventListener('pointerdown', evt => {
      if (!currentFile() || isSingleFrame() || state.busy) return;
      if (evt.target === rangeStartHandle) state.activeRangeHandle = 'start';
      else if (evt.target === rangeEndHandle) state.activeRangeHandle = 'end';
      else {
        setFrame(frameFromTimelineEvent(evt));
        return;
      }
      evt.preventDefault();
      rangeTimeline.setPointerCapture(evt.pointerId);
      updateRangeHandle(state.activeRangeHandle, evt);
    });
    rangeTimeline.addEventListener('pointermove', evt => {
      if (!state.activeRangeHandle) return;
      updateRangeHandle(state.activeRangeHandle, evt);
    });
    rangeTimeline.addEventListener('pointerup', evt => {
      state.activeRangeHandle = null;
      if (rangeTimeline.hasPointerCapture(evt.pointerId)) {
        rangeTimeline.releasePointerCapture(evt.pointerId);
      }
    });
    rangeTimeline.addEventListener('pointercancel', evt => {
      state.activeRangeHandle = null;
      if (rangeTimeline.hasPointerCapture(evt.pointerId)) {
        rangeTimeline.releasePointerCapture(evt.pointerId);
      }
    });
    document.getElementById('setRangeSourceBtn').addEventListener('click', () => {
      state.rangeSource = clampFrameIndex(state.frame);
      state.rangeSourceLocked = true;
      captureRangeShapes(state.rangeSource);
      renderRangeControls();
      draw();
    });
    addRangeSegmentBtn.addEventListener('click', addCurrentRangeSegment);
    clearRangeSegmentsBtn.addEventListener('click', clearRangeSegments);
    document.getElementById('setRangeStartBtn').addEventListener('click', () => {
      adoptCurrentFrameShapeIfNeeded();
      setRange(state.frame, state.rangeEnd);
    });
    document.getElementById('setRangeEndBtn').addEventListener('click', () => setRange(state.rangeStart, state.frame));
    document.getElementById('setWholeRangeBtn').addEventListener('click', setWholeRangeTarget);
    document.getElementById('applyRangeBtn').addEventListener('click', applyRangeToFrames);
    removeRangeBtn.addEventListener('click', removeRangeShapesFromFrames);
    copyShapesBtn.addEventListener('click', copySelectedShapes);
    pasteShapesBtn.addEventListener('click', pasteCopiedShapes);
    document.getElementById('saveBtn').addEventListener('click', async () => {
      try {
        await saveAnnotations();
      } catch (error) {
        showError(error);
      }
    });
    document.getElementById('sourceBrowseBtn').addEventListener('click', () => pickDirectory('source').catch(showError));
    document.getElementById('outputBrowseBtn').addEventListener('click', () => pickDirectory('output').catch(showError));
    document.getElementById('refreshBtn').addEventListener('click', () => boot().catch(showError));
    [sourceDirInput, outputDirInput].forEach(input => {
      input.addEventListener('keydown', evt => {
        if (evt.key !== 'Enter') return;
        evt.preventDefault();
        saveDirectories().catch(showError);
      });
      input.addEventListener('change', () => saveDirectories().catch(showError));
    });
    sourceFilter.addEventListener('click', evt => {
      const button = evt.target.closest('button[data-filter]');
      if (!button) return;
      state.sourceFilter = button.dataset.filter || 'all';
      renderSourceFilter();
      renderSourceFileList();
    });
    sourceKindFilter.addEventListener('click', evt => {
      const button = evt.target.closest('button[data-kind]');
      if (!button) return;
      state.sourceKindFilter = button.dataset.kind || 'all';
      renderSourceFilter();
      renderSourceFileList();
    });
    animatedFormatControl.addEventListener('click', evt => {
      const button = evt.target.closest('button[data-format]');
      if (!button) return;
      state.animatedFormat = button.dataset.format || 'avif';
      saveExportSettings();
      renderExportSettings();
      statusEl.textContent = `动图将导出为 ${state.animatedFormat.toUpperCase()}`;
    });
    autoCompressToggle.addEventListener('change', () => {
      state.exportAutoCompress = autoCompressToggle.checked;
      saveExportSettings();
      renderExportSettings();
      statusEl.textContent = state.exportAutoCompress
        ? `自动压缩已开启：${formatExportMB(state.exportMaxMB)} MB`
        : '自动压缩已关闭';
    });
    maxOutputMbInput.addEventListener('change', () => {
      state.exportMaxMB = normalizeExportMaxMB(maxOutputMbInput.value);
      saveExportSettings();
      renderExportSettings();
      statusEl.textContent = `最大体积：${formatExportMB(state.exportMaxMB)} MB`;
    });
    maxOutputMbInput.addEventListener('input', () => {
      const value = Number(maxOutputMbInput.value);
      if (!Number.isFinite(value) || value <= 0) return;
      state.exportMaxMB = normalizeExportMaxMB(value);
      exportSettingSummary.textContent = exportSettingsLabel();
      settingsExportSummary.textContent = exportSettingsLabel();
    });
    selectAllSourcesBtn.addEventListener('click', () => {
      if (!state.workspace?.sourceFiles.length) {
        statusEl.textContent = '没有可选图片';
        return;
      }
      const allActive = state.workspace.sourceFiles.every(source => source.active);
      updateActiveFiles(allActive
        ? new Set()
        : new Set(state.workspace.sourceFiles.map(source => source.id))
      ).catch(showError);
    });
    document.getElementById('exportSelectedBtn').addEventListener('click', () => {
      exportSelectedAssets().catch(showError);
    });
    frameSlider.addEventListener('input', () => setFrame(Number(frameSlider.value)));
    frameSlider.addEventListener('pointerdown', evt => {
      if (frameSlider.disabled || isSingleFrame()) return;
      evt.preventDefault();
      state.frameSliderDragging = true;
      frameSlider.setPointerCapture(evt.pointerId);
      setFrame(frameFromSliderEvent(evt));
    });
    frameSlider.addEventListener('pointermove', evt => {
      if (!state.frameSliderDragging) return;
      evt.preventDefault();
      setFrame(frameFromSliderEvent(evt));
    });
    frameSlider.addEventListener('pointerup', evt => {
      state.frameSliderDragging = false;
      if (frameSlider.hasPointerCapture(evt.pointerId)) {
        frameSlider.releasePointerCapture(evt.pointerId);
      }
    });
    frameSlider.addEventListener('pointercancel', evt => {
      state.frameSliderDragging = false;
      if (frameSlider.hasPointerCapture(evt.pointerId)) {
        frameSlider.releasePointerCapture(evt.pointerId);
      }
    });

    window.addEventListener('keydown', evt => {
      if (state.capturingShortcut) {
        const combo = shortcutForEvent(evt);
        if (!combo) return;
        evt.preventDefault();
        setShortcut(state.capturingShortcut, combo);
        return;
      }
      if (state.drawing?.type === 'polygon') {
        if (evt.key === 'Enter') {
          evt.preventDefault();
          finishPolygonDrawing();
          return;
        }
        if (evt.key === 'Backspace') {
          evt.preventDefault();
          removeLastPolygonPoint();
          return;
        }
        if (evt.key === 'Escape') {
          evt.preventDefault();
          resetCanvasInteraction();
          draw();
          statusEl.textContent = '已取消多边形';
          return;
        }
      }
      if (!settingsOverlay.hidden) {
        if (evt.key === 'Escape') {
          evt.preventDefault();
          closeSettings();
        }
        return;
      }
      if (evt.target instanceof HTMLInputElement) return;
      if (evt.code === 'Space' && !state.drawing) {
        evt.preventDefault();
        togglePlayback();
        return;
      }
      if ((evt.ctrlKey || evt.metaKey) && !evt.shiftKey && evt.key.toLowerCase() === 'c') {
        if (!hasTextSelection() && selectedFrameShapes().length) {
          evt.preventDefault();
          copySelectedShapes();
        }
        return;
      }
      if ((evt.ctrlKey || evt.metaKey) && !evt.shiftKey && evt.key.toLowerCase() === 'v') {
        evt.preventDefault();
        pasteCopiedShapes();
        return;
      }
      if (shortcutMatches(evt, 'save')) {
        evt.preventDefault();
        document.getElementById('saveBtn').click();
        return;
      }
      if (shortcutMatches(evt, 'undo')) {
        evt.preventDefault();
        undoLast();
        return;
      }
      if (shortcutMatches(evt, 'prevFile')) {
        evt.preventDefault();
        selectRelativeFile(-1);
        return;
      }
      if (shortcutMatches(evt, 'nextFile')) {
        evt.preventDefault();
        selectRelativeFile(1);
        return;
      }
      if (shortcutMatches(evt, 'prevFrame')) {
        evt.preventDefault();
        setFrame(state.frame - 1);
        return;
      }
      if (shortcutMatches(evt, 'nextFrame')) {
        evt.preventDefault();
        setFrame(state.frame + 1);
        return;
      }
      if (shortcutMatches(evt, 'toggleComplete')) {
        evt.preventDefault();
        completeCurrentFileAndAdvance();
        return;
      }
      if (shortcutMatches(evt, 'rangeStart')) {
        evt.preventDefault();
        adoptCurrentFrameShapeIfNeeded();
        setRange(state.frame, state.rangeEnd);
        return;
      }
      if (shortcutMatches(evt, 'rangeEnd')) {
        evt.preventDefault();
        setRange(state.rangeStart, state.frame);
        return;
      }
      if (shortcutMatches(evt, 'applyRange')) {
        evt.preventDefault();
        applyRangeToFrames();
        return;
      }
      if (shortcutMatches(evt, 'cancel')) {
        evt.preventDefault();
        resetCanvasInteraction();
        releaseDrawingPointer();
        draw();
        return;
      }
      if (shortcutMatches(evt, 'delete')) {
        evt.preventDefault();
        deleteSelected();
      }
    });

    window.addEventListener('pagehide', flushAutoSaveOnExit);
    window.addEventListener('beforeunload', flushAutoSaveOnExit);

    async function boot() {
      const data = await apiJson('/api/bootstrap');
      state.annotations = data.annotations || { version: 1, files: {} };
      state.savedSnapshot = annotationsSnapshot();
      state.history = [];
      state.saveError = false;
      state.saving = false;
      state.autoImportFailures.clear();
      clearPendingAutoSave();
      applyWorkspaceAndManifest(data.workspace, data.manifest);
      setDirty(false);
      scheduleAutoImport(200);
    }

    loadShortcuts();
    loadExportSettings();
    renderShortcutList();
    renderExportSettings();
    boot().catch(showError);
  </script>
</body>
</html>
